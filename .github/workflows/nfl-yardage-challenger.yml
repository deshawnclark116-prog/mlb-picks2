name: NFL model-family challenger research
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'xgboost>=2,<4' 'lightgbm>=4,<5' 'catboost>=1.2,<2'
      - name: Download official nflverse play-by-play files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nflcsv
          for y in 2023 2024 2025 2026; do
            curl -fL --retry 3 --retry-delay 3 \
              "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${y}.csv.gz" \
              -o "/tmp/nflcsv/play_by_play_${y}.csv.gz"
            gzip -t "/tmp/nflcsv/play_by_play_${y}.csv.gz"
          done
      - name: Download FTN charting injury and snap records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nflfeatures
          for y in 2023 2024 2025 2026; do
            for family in ftn_charting injuries snap_counts; do
              file="${family}_${y}.csv"
              curl -fL --retry 3 --retry-delay 3 \
                "https://github.com/nflverse/nflverse-data/releases/download/${family}/${file}" \
                -o "/tmp/nflfeatures/${file}"
              test -s "/tmp/nflfeatures/${file}"
            done
          done
      - name: Score LightGBM and CatBoost contender grid
        run: |
          set -euo pipefail
          python -u research/nfl_model_tests/challenger_gbdt_v4.py \
            --db nfl_models/nfl_model.sqlite \
            --pbp-dir /tmp/nflcsv \
            --feature-dir /tmp/nflfeatures \
            --out /tmp/nfl-gbdt-v4-result.json | tee /tmp/nfl-gbdt-v4.log
          test -s /tmp/nfl-gbdt-v4-result.json
      - name: Upload scored results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-gbdt-v4-results
          path: |
            /tmp/nfl-gbdt-v4-result.json
            /tmp/nfl-gbdt-v4.log
          if-no-files-found: warn
