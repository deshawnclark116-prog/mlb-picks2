name: NFL Sunday early inactive refresh contract
on:
  pull_request:
    paths:
      - .github/workflows/all_sports_predictions.yml
      - tests/test_nfl_early_game_sunday_refresh.py
      - .github/workflows/nfl_sunday_early_refresh_contract.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Sunday EST prekick refresh and immediate validated NFL publication
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_nfl_early_game_sunday_refresh.py
