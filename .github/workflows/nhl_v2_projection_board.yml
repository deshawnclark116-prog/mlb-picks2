name: NHL V2 NFL-style projection preview (read-only)

on:
  push:
    branches: [feature/nhl-v2-nfl-style-projection-board]
    paths:
      - 'nhl_v2_projection_board_publish.py'
      - 'tests/test_nhl_v2_projection_board_publish.py'
      - 'docs/nhl.html'
      - 'docs/nfl.html'
      - 'docs/index.html'
      - '.github/workflows/nhl_v2_projection_board.yml'
  pull_request:
    paths:
      - 'nhl_v2_projection_board_publish.py'
      - 'tests/test_nhl_v2_projection_board_publish.py'
      - 'docs/nhl.html'
      - 'docs/nfl.html'
      - 'docs/index.html'
      - '.github/workflows/nhl_v2_projection_board.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhl-v2-projection-preview
  cancel-in-progress: false

jobs:
  projection-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen NHL research dependencies
        run: python -m pip install -r requirements-research-nhl.txt
      - name: Test original mean/dispersion, horizon and identity policies
        run: |
          python -m pytest -q tests/test_nhl_v2_projection_board_publish.py tests/test_nhl_v2_phase1c_probabilities.py
      - name: Verify immutable original B2 engine and ledger
        run: python nhl_v2_phase1a_sog_forward.py verify
      - name: Build read-only corrected-count VIEW, never overwrite original rows
        run: |
          mkdir -p preview
          python nhl_v2_projection_board_publish.py --out preview/nhl_v2_shadow.json
          cp docs/nhl.html preview/index.html
      - name: Verify document publishing is not a betting decision or a synthetic backfill
        run: |
          python - <<'PY'
          import json
          d=json.load(open('preview/nhl_v2_shadow.json'))
          assert d['verified_original_hash_chain'] and d['verified_frozen_code_and_model_lock']
          assert d['status']=='RESEARCH_ONLY_NOT_VALIDATED_FOR_BETTING'
          assert d['actual_player_book_lines_verified'] is False
          assert d['dressed_lineups_verified'] is False
          assert d['historical_corrected_probabilities_were_not_published_pregame'] is True
          assert d['total_valid_forecasts']>0, 'No real V2 forecasts; do not ship a fake prediction page'
          assert 'line' not in d['row_fields']
          print('Published historical V2 count-view rows:', d['total_valid_forecasts'])
          PY
          git diff --exit-code -- nhl_models/nhl_player_outcome_v2 docs/nhl_predictions.json docs/nhl_picks_log.jsonl
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-v2-nfl-style-historical-projections
          path: |
            preview/index.html
            preview/nhl_v2_shadow.json
          retention-days: 30
          if-no-files-found: warn
