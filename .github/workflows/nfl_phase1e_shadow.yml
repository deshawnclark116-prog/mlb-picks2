name: NFL Phase 1E shadow (durable dispatch)

# Shadow-only dispatcher for the frozen NFL Phase 1 engine + frozen v2 comparator. It runs ONLY nfl_phase1e_scheduler.py; it does not build any other sport and does not
# touch docs/nfl_predictions.json or production serving. R11 (simulation N) is still a BLOCKER: forecasts are operational shadow evidence, not freeze evidence.
#
# Durability: verified CAS blobs are also chunked/compressed onto nfl-shadow-state; cache is optional.
# Audited Actions ownership preserves physical binding history; local session flock + global concurrency + Git CAS protect writes.
# Every valid capture is checkpointed BEFORE model generation. Failure never triggers an unconditional self-chain.
#
# Cadence: every 10 minutes, deliberately OFF the round marks (3,13,...); nfl_shadow_watchdog.yml re-dispatches this same workflow when the collector is stale and a cutoff is near. GitHub may delay or drop scheduled runs (this repo has seen 11-90 min delays); a cutoff that passes without a valid pre-cutoff snapshot is
# recorded MISSED_REAL_CUTOFF and never backfilled. Cost note: ~1-2 min of runner time per idle invocation; reduce the cron if Actions minutes are limited.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # off the contended round-10 marks; redundant trigger: .github/workflows/nfl_shadow_watchdog.yml (8,18,28,38,48,58)
  workflow_dispatch:
    inputs:
      mode:
        description: "run = tick + prefit-if-allowed + heartbeat; prefit = ONLY the guarded prefit step (no dispatch, no live capture); readiness = deep readiness check; status = print status.json"
        type: choice
        default: run
        options: [run, prefit, readiness, status, audit]
      n_draws:
        description: "operational simulation draws (R11 unresolved; operational only)"
        default: "100000"
      duration_min:
        description: "keep ticking for this many minutes (manual recovery near a cutoff)"
        default: "0"

# One run at a time; a queued run waits (never cancelled mid-forecast) so overlapping runs cannot create duplicate forecasts.
concurrency:
  group: nfl-phase1e-shadow
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # (a) dispatch the read-only publisher after a checkpoint that added forecasts, (b) chain the next durable run when cutoffs remain

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 240      # long recovery runs (duration_min up to ~200) are safe: state is checkpointed after every state-changing tick
    env:
      STATE_BRANCH: nfl-shadow-state
      NFL_SHADOW_CONCURRENCY: nfl-phase1e-shadow
      N_DRAWS: ${{ github.event.inputs.n_draws || '100000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the state branch exists
        run: |
          set -e
          if ! git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git config user.name "nfl-shadow-bot"; git config user.email "nfl-shadow-bot@users.noreply.github.com"
            git checkout --orphan "$STATE_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            printf 'cas/blobs/\ncas_v2_raw_schedule/blobs/\ntmp/\n*.lock\n.*.tmp\n' > .gitignore
            echo "NFL Phase 1E shadow state (append-only ledgers and stores). Written only by .github/workflows/nfl_phase1e_shadow.yml" > README.md
            git add .gitignore README.md
            git commit -m "init NFL shadow state branch"
            git push origin "$STATE_BRANCH"
            git checkout -f "${GITHUB_SHA}"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STATE_BRANCH }}
          path: state

      - name: Restore snapshot blobs (cache, hash-verified on read)
        uses: actions/cache/restore@v4
        with:
          path: |
            state/cas/blobs
            state/cas_v2_raw_schedule/blobs
          key: nfl-p1e-cas-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nfl-p1e-cas-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install numpy scipy xgboost

      - name: Audited single-writer shadow entrypoint
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          DURATION: ${{ github.event.inputs.duration_min || '0' }}
        run: |
          set -o pipefail
          if [ "$DURATION" -gt 180 ]; then echo "::error::duration exceeds bounded recovery window"; exit 1; fi
          if [ "$MODE" = audit ]; then
            python -u nfl_shadow_ownership.py run --root state -- python -u nfl_shadow_source_audit.py --root state
            exit 0
          fi
          python -u nfl_shadow_ownership.py run --root state -- \
            python -u nfl_phase1e_scheduler.py "$MODE" --root state --n "$N_DRAWS" --lead-min 20 \
            --duration-min "$DURATION" --checkpoint-cmd "bash $GITHUB_WORKSPACE/scripts/nfl_state_checkpoint.sh"

      - name: Save snapshot blobs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/cas/blobs
            state/cas_v2_raw_schedule/blobs
          key: nfl-p1e-cas-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve local diagnostics if a durable checkpoint failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-shadow-failure-${{ github.run_id }}
          path: |
            state/status.json
            state/readiness.json
            state/dispatch_ledger.jsonl
            state/operational_events.jsonl
            state/ownership_transitions.jsonl
          retention-days: 30
