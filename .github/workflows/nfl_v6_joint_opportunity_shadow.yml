name: NFL V6 joint-game shadow validation
on:
  workflow_dispatch:
  push:
    paths:
      - nfl_v6_joint_opportunity_shadow.py
      - nfl_v6_shadow_numeric_grade.py
      - nfl_v6_same_cohort_diagnostic.py
      - tests/test_nfl_v6_same_cohort_diagnostic.py
      - tests/test_nfl_v6_joint_opportunity_shadow.py
      - .github/workflows/nfl_v6_joint_opportunity_shadow.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical runtime
        run: pip install numpy
      - name: Enforce as-of chronology and coupled simulation invariants
        run: python -m unittest discover -s tests -p 'test_nfl_v6_joint_opportunity_shadow.py' -v
      - name: Test strict same-player original forecast comparison
        run: python -m unittest discover -s tests -p 'test_nfl_v6_same_cohort_diagnostic.py' -v
      - name: Exercise full real historical NFL foundation as shadow
        run: |
          python nfl_v6_joint_opportunity_shadow.py \
            --db nfl_models/nfl_model.sqlite --season 2025 --week 9 \
            --sims 20000 --out /tmp/nfl_v6_w09_shadow.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nfl_v6_w09_shadow.json'))
          assert d['status']=='RESEARCH_SHADOW_NOT_PROMOTED'
          assert d['sportsbook_inputs'] is False
          assert d['sims_per_game']==20000
          assert d['game_count']>0
          n=sum(len(g['projections']) for g in d['games'])
          assert n>15, f'Not enough real source player outcomes: {n}'
          assert all(p['is_forward_calibrated'] is False and
                     p['probability_event']=='P_YARDS_AT_LEAST_ROUNDED_MODEL_MEAN'
                     for g in d['games'] for p in g['projections'])
          print('NFL_V6_SHADOW_QA',json.dumps({'games':len(d['games']),
                  'projections':n,'simulations_per_game':d['sims_per_game'],
                  'unverified_team_states':sum(v['status']!='SIMULATED_ROLE_UNVERIFIED'
                    for g in d['games'] for v in g['teams'].values())}))
          PY
      - name: Produce original pregame 2026 Week 9 shadow for BUF at MIN
        run: |
          python nfl_v6_joint_opportunity_shadow.py \
            --db nfl_models/nfl_model.sqlite --season 2026 --week 9 \
            --sims 20000 --out /tmp/nfl_v6_w09_2026_shadow.json
          python - <<'PY'
          import json
          doc=json.load(open('/tmp/nfl_v6_w09_2026_shadow.json'))
          game=next((g for g in doc['games'] if {g['home'],g['away']}=={'BUF','MIN'}),None)
          if game is None:
              print('NFL_V6_BUF_MIN_SOURCE_MISSING; no predictions fabricated')
          else:
              print('NFL_V6_BUF_MIN',json.dumps({'team_states':game['teams'],
                'player_projections':[
                  {'player':p['player'],'market':p['market'],'mean':p['projected_mean'],
                   'event':p['probability_event'],'reach':p['prob_reach_rounded_mean']}
                  for p in game['projections'] if p['player'] in (
                    'Justin Jefferson','Aaron Jones','James Cook','DJ Moore','Khalil Shakir')]},
                separators=(',',':')))
          PY
      - name: Frozen shadow grading on exact real player-game outcomes
        run: |
          python nfl_v6_shadow_numeric_grade.py \
            --forecast /tmp/nfl_v6_w09_shadow.json \
            --db nfl_models/nfl_model.sqlite \
            --out /tmp/nfl_v6_w09_grade.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/nfl_v6_w09_grade.json'))
          assert report['status']=='NOT_PROMOTABLE_NO_SAME_COHORT_CHAMPION_COMPARISON'
          assert report['matched']>15
          print('NFL_V6_GRADE_COVERAGE',report['matched'],report['unmatched_or_pending'])
          PY
      - name: Same-cohort 2026 week 9 diagnostic versus genuinely frozen incumbent
        run: |
          python nfl_v6_same_cohort_diagnostic.py \
            --v6 /tmp/nfl_v6_w09_2026_shadow.json \
            --firstseen docs/nfl_precision_firstseen.jsonl \
            --db nfl_models/nfl_model.sqlite \
            --out /tmp/nfl_v6_2026_w09_paired.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/nfl_v6_2026_w09_paired.json'))
          assert p['promotion_eligible'] is False
          print('NFL_V6_FIRSTSEEN_PAIRED_COVERAGE',p['matched'],'/',p['firstseen_total_rows'])
          print('NFL_V6_FIRSTSEEN_PAIRED_METRICS',json.dumps(p['overall']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-v6-2025-week09-shadow-research
          path: |
            /tmp/nfl_v6_w09_shadow.json
            /tmp/nfl_v6_w09_grade.json
            /tmp/nfl_v6_w09_2026_shadow.json
            /tmp/nfl_v6_2026_w09_paired.json
          if-no-files-found: ignore
