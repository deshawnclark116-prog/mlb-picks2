name: NFL pregame player-specific scout evidence (research only)
on:
  pull_request:
    paths:
      - nfl_game_scout.py
      - tests/test_nfl_game_scout.py
      - .github/workflows/nfl_game_scout_research.yml
      - docs/research/nfl_game_scout_contract.md
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source_grounded_scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pregame-only football intelligence
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nfl_game_scout.py -v
          python -m py_compile nfl_game_scout.py
      - name: Download actual prior-year and current-year free play and snap evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nfl_scout_data"
          for y in 2025 2026; do
            curl --fail --location --silent --show-error --retry 3 --max-time 240               "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${y}.csv.gz"               -o "$RUNNER_TEMP/nfl_scout_data/play_by_play_${y}.csv.gz"
            curl --fail --location --silent --show-error --retry 3 --max-time 240               "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_${y}.csv"               -o "$RUNNER_TEMP/nfl_scout_data/snap_counts_${y}.csv"
            curl --fail --location --silent --show-error --retry 3 --max-time 240 "https://github.com/nflverse/nflverse-data/releases/download/pfr_advstats/advstats_week_def_${y}.csv" -o "$RUNNER_TEMP/nfl_scout_data/advstats_week_def_${y}.csv"
            test -s "$RUNNER_TEMP/nfl_scout_data/advstats_week_def_${y}.csv"
            test -s "$RUNNER_TEMP/nfl_scout_data/play_by_play_${y}.csv.gz"
            test -s "$RUNNER_TEMP/nfl_scout_data/snap_counts_${y}.csv"
          done
      - name: Build upcoming-game scout evidence without changing serving predictions
        run: |
          set -euo pipefail
          python nfl_game_scout.py             --board docs/nfl_predictions.json             --roles docs/nfl_role_snapshot.json             --injuries docs/nfl_sleeper_injury_snapshot.json             --pbp "$RUNNER_TEMP/nfl_scout_data/play_by_play_2025.csv.gz"             --pbp "$RUNNER_TEMP/nfl_scout_data/play_by_play_2026.csv.gz"             --snaps "$RUNNER_TEMP/nfl_scout_data/snap_counts_2025.csv"             --snaps "$RUNNER_TEMP/nfl_scout_data/snap_counts_2026.csv"             --pfr-def "$RUNNER_TEMP/nfl_scout_data/advstats_week_def_2025.csv"             --pfr-def "$RUNNER_TEMP/nfl_scout_data/advstats_week_def_2026.csv"             --out "$RUNNER_TEMP/nfl_game_scout_evidence.json" \
            --md-out "$RUNNER_TEMP/nfl_game_scout_notes.md"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"nfl_game_scout_evidence.json"
          j=json.loads(p.read_text())
          assert j["projection_or_pick_modified"] is False
          assert j["player_versus_player_matchups_verified"] is False
          assert j["summary"]["scouted_player_markets"] > 0
          assert j["summary"]["player_markets_with_named_defender_charting"] > 0, "PFR defender source failed to join to prior snaps"
          print("ACCEPTED: actual pregame cards = ",j["summary"])
          examples=j["player_cards"][:3]
          for card in examples:
              print(card["player"],card["team"],card["opponent"],
                    card["market"],"projection",card["published_projection_yards"],
                    "warnings",card["data_warnings"],
                    "matched mechanisms",len(card["matched_play_mechanisms"]))
          PY
      - name: Preserve actual game scout findings as an immutable workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-game-scout-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nfl_game_scout_evidence.json
            ${{ runner.temp }}/nfl_game_scout_notes.md
          if-no-files-found: warn
          retention-days: 30
