name: NFL every original game prediction grading
on:
  push:
    branches: [main]
    paths:
      - nfl_v2_firstseen_true_stats_backtest.py
      - nfl_v2_bookline_win_loss_audit.py
      - nfl_grade_all_pregame_predictions.py
      - nfl_all_grade_summary.py
      - tests/test_nfl_all_grade_summary.py
      - nfl_recent_espn_final_truth.py
      - tests/test_nfl_grade_all_pregame_predictions.py
      - nfl_v2_postgame_grade_coverage.py
      - tests/test_nfl_v2_postgame_grade_coverage.py
      - nfl_verified_quote_parser.py
      - nfl_serving_builder_a.py
      - tests/test_nfl_v2_firstseen_true_stats_backtest.py
      - tests/test_nfl_v2_bookline_win_loss_audit.py
      - tests/test_nfl_verified_quote_parser.py
      - .github/workflows/nfl_v2_firstseen_true_stats_backtest.yml
  pull_request:
    paths:
      - nfl_v2_firstseen_true_stats_backtest.py
      - nfl_grade_all_pregame_predictions.py
      - nfl_recent_espn_final_truth.py
      - nfl_all_grade_summary.py
      - tests/test_nfl_all_grade_summary.py
      - tests/test_nfl_grade_all_pregame_predictions.py
      - tests/test_nfl_v2_firstseen_true_stats_backtest.py
      - .github/workflows/nfl_v2_firstseen_true_stats_backtest.yml
  schedule:
    # Postgame DAILY, not Wednesday-only. If finals lag in source, retry next day.
    - cron: "33 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: nfl-v2-verified-real-stats-backtest
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  test-backtest-no-hindsight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy numpy
      - run: |
          python -m pytest -q tests/test_nfl_v2_firstseen_true_stats_backtest.py tests/test_nfl_v2_bookline_win_loss_audit.py tests/test_nfl_verified_quote_parser.py tests/test_nfl_v2_postgame_grade_coverage.py tests/test_nfl_grade_all_pregame_predictions.py tests/test_nfl_all_grade_summary.py
          python -m py_compile nfl_v2_firstseen_true_stats_backtest.py nfl_v2_bookline_win_loss_audit.py nfl_v2_postgame_grade_coverage.py nfl_grade_all_pregame_predictions.py nfl_recent_espn_final_truth.py nfl_all_grade_summary.py

  grade-real-completed-games:
    needs: test-backtest-no-hindsight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: code
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: nfl-shadow-state
          path: original
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen publisher verification runtime
        run: python -m pip install numpy
      - name: Fetch and ingest source-authoritative 2025/2026 player-stat results
        env:
          # nfl_player_games_foundation_a.py already authenticates GitHub
          # release requests with GITHUB_TOKEN. Without this, shared Actions
          # runner IPs get unauthenticated API 403/60-request exhaustion.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u code/nfl_player_games_foundation_a.py \
            --season 2025 2026 \
            --db "$RUNNER_TEMP/nfl-v2-final-source.sqlite"
      - name: Independent recent completed-game player actuals, INCLUDING total tackles
        run: |
          python -u code/nfl_recent_espn_final_truth.py \
            --days 5 \
            --out "$RUNNER_TEMP/nfl-final-espn-actuals.json"
      - name: Grade every logged original NFL production prediction, not only bookmaker sides
        env:
          PYTHONPATH: code
        run: |
          python -u code/nfl_grade_all_pregame_predictions.py \
            --db "$RUNNER_TEMP/nfl-v2-final-source.sqlite" \
            --log code/docs/nfl_picks_log.jsonl \
            --espn-recent "$RUNNER_TEMP/nfl-final-espn-actuals.json" \
            --out "$RUNNER_TEMP/nfl-original-serving-predictions-grade.json"
          python - "$RUNNER_TEMP/nfl-original-serving-predictions-grade.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schema']=='NFL_FIRST_SEEN_ALL_SERVED_PREDICTIONS_GRADE_V1'
          assert d['original_count']==d['accounted_for']>0
          assert d['production_vs_research_separate']
          assert d['verified_outcome_count']+d['unverified_count']==d['original_count']
          print('ALL_ORIGINAL_PRODUCTION_PREDICTIONS_ACCOUNTED',d['original_count'],
                'graded',d['verified_outcome_count'],'unverified',d['unverified_count'],
                'games',len(d['by_game']),flush=True)
          PY
      - name: Grade only original first-seen verified T24 and T90 model statistics
        env:
          PYTHONPATH: code
        run: |
          python -u code/nfl_v2_firstseen_true_stats_backtest.py \
            --state original \
            --db "$RUNNER_TEMP/nfl-v2-final-source.sqlite" \
            --espn-actuals "$RUNNER_TEMP/nfl-final-espn-actuals.json" \
            --out "$RUNNER_TEMP/nfl-v2-real-stat-scorecard.json"
          python - "$RUNNER_TEMP/nfl-v2-real-stat-scorecard.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schema']=='NFL_V2_FIRST_SEEN_REAL_FINAL_NUMERIC_SCORECARD_V1'
          assert d['first_seen_pre_cutoff_only'] and not d['automatic_model_promotion']
          assert d['graded_player_outcomes'] > 0
          assert d['every_genuine_original_forecast_accounted']
          assert d['graded_player_outcomes']+d['unverified_original_forecasts']==d['total_original_pregame_forecasts']
          print('ACTUAL_V2_NUMERIC_RESULT',json.dumps({
            'games':d['completed_games_with_verified_forecasts'],
            'graded':d['graded_player_outcomes'],
            'horizons':d['by_horizon'],
            'markets':d['by_market_horizon'],
            'weeks':d['by_week'],
            'excluded':d['exclusions']},sort_keys=True))
          PY
      - name: Independently check completed NFL games with frozen V2 forecasts that still lack grades
        env:
          PYTHONPATH: code
        run: |
          python -u code/nfl_v2_postgame_grade_coverage.py \
            --state original \
            --scorecard "$RUNNER_TEMP/nfl-v2-real-stat-scorecard.json" \
            --out "$RUNNER_TEMP/nfl-v2-postgame-grade-status.json"
      - name: Create concise game-by-game public grade index across ALL original prediction streams
        env:
          PYTHONPATH: code
        run: |
          python -u code/nfl_all_grade_summary.py \
            --production "$RUNNER_TEMP/nfl-original-serving-predictions-grade.json" \
            --v2 "$RUNNER_TEMP/nfl-v2-real-stat-scorecard.json" \
            --coverage "$RUNNER_TEMP/nfl-v2-postgame-grade-status.json" \
            --out "$RUNNER_TEMP/nfl-all-game-grade-summary.json"
      - name: Report archived-bookline V2 hypothetical W/L separately from original published picks
        run: |
          python -u code/nfl_v2_bookline_win_loss_audit.py \
            --v2 "$RUNNER_TEMP/nfl-v2-real-stat-scorecard.json" \
            --ledger code/docs/nfl_picks_log.jsonl \
            --legacy-grade code/docs/nfl_record.json \
            --schedule code/docs/nfl_predictions_2026_w05.json \
            --out "$RUNNER_TEMP/nfl-v2-bookline-win-loss.json"
          python - "$RUNNER_TEMP/nfl-v2-bookline-win-loss.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["v2_official_bet_record_count"]==0
          assert d["v2_model_not_original_wager_publisher"] is True
          # Archive is allowed to have no verifiable, valid pregame book comparison
          # on later NFL weeks. Model predictions are not invented bets.
          assert d["v2_hypothetical_bookline_grading"]["T90"]["book_comparisons"]>=0
          print("V2_BOOKLINE_SIDE_VS_REAL_OUTCOME",d["v2_hypothetical_bookline_grading"])
          print("SEPARATE_PUBLISHED_LEGACY_BETS",d["original_legacy_serving_booked_picks_not_v2"]["summary"])
          PY
      - name: Preserve exact player-level projections, results, and exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v2-true-first-pregame-stat-errors-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nfl-v2-real-stat-scorecard.json
            ${{ runner.temp }}/nfl-v2-postgame-grade-status.json
            ${{ runner.temp }}/nfl-final-espn-actuals.json
            ${{ runner.temp }}/nfl-original-serving-predictions-grade.json
            ${{ runner.temp }}/nfl-all-game-grade-summary.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit evidence-only scorecard without model or prediction edits
        run: |
          set -euo pipefail
          cd code
          git config user.name "nfl-v2-truth-audit[bot]"
          git config user.email "nfl-v2-truth-audit[bot]@users.noreply.github.com"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/nfl-v2-real-stat-scorecard.json" docs/nfl_v2_firstseen_real_stat_backtest.json
            cp "$RUNNER_TEMP/nfl-v2-bookline-win-loss.json" docs/nfl_v2_bookline_win_loss_audit.json
            cp "$RUNNER_TEMP/nfl-v2-postgame-grade-status.json" docs/nfl_v2_postgame_grade_status.json
            cp "$RUNNER_TEMP/nfl-original-serving-predictions-grade.json" docs/nfl_all_original_predictions_grade.json
            cp "$RUNNER_TEMP/nfl-all-game-grade-summary.json" docs/nfl_all_game_grade_summary.json
            git add docs/nfl_v2_firstseen_real_stat_backtest.json docs/nfl_v2_bookline_win_loss_audit.json docs/nfl_v2_postgame_grade_status.json docs/nfl_all_original_predictions_grade.json docs/nfl_all_game_grade_summary.json
            if git diff --cached --quiet; then
              echo "NO_CHANGES_TO_PLAYER_STAT_SCORECARD"
              break
            fi
            git commit -m "Backtest V2 actual pregame stat projections against completed games"
            if git push origin HEAD:main; then
              echo "NFL_V2_GENUINE_BACKTEST_PUBLISHED"
              break
            fi
            if [ "$n" = 5 ]; then exit 1; fi
          done

      - name: Fail loudly if original pregame V2 forecasts remain ungraded after final
        run: |
          python - "$RUNNER_TEMP/nfl-v2-postgame-grade-status.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schema']=='NFL_V2_POSTGAME_GRADING_COVERAGE_V1'
          assert d['research_only_no_bookmaker_wagers']
          pending=d['recent_frozen_game_horizons_ungraded']
          print('NFL_V2_GRADE_STATUS',d['status'],'finals',d['recent_completed_game_count'],
                'graded',d['recent_frozen_game_horizons_graded'],
                'ungraded',pending,
                'original_forecasts_missing',d['recent_game_horizons_missing_original_forecast'])
          if pending:
              for item in d['not_yet_graded']:
                  print('::error::Frozen NFL V2 forecast ungraded after completed game:',
                        item['game_id'],item['horizon'])
              sys.exit(1)
          PY
