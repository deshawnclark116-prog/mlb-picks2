name: CFB moneyline first-seen probability fidelity
on:
  push:
    branches: [research/cfb-moneyline-calibration-receipts-20261011]
    paths:
      - cfb_moneyline_pair_provenance.py
      - cfb_moneyline_firstseen_diagnostic.py
      - cfb_serving_builder_a.py
      - tests/test_cfb_moneyline_pair_provenance.py
      - .github/workflows/cfb_moneyline_probability_fidelity.yml
      - .github/workflows/all_sports_predictions.yml
      - docs/research/cfb_moneyline_fidelity_v01.md
  pull_request:
    paths:
      - cfb_moneyline_pair_provenance.py
      - cfb_moneyline_firstseen_diagnostic.py
      - cfb_serving_builder_a.py
      - tests/test_cfb_moneyline_pair_provenance.py
      - .github/workflows/cfb_moneyline_probability_fidelity.yml
      - .github/workflows/all_sports_predictions.yml
      - docs/research/cfb_moneyline_fidelity_v01.md
permissions:
  contents: read
jobs:
  original-forecast-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Prove normalizer receipt and exact original-firstseen same-game scoring
        run: |
          python -m pytest -q tests/test_cfb_moneyline_pair_provenance.py
          python -m py_compile cfb_moneyline_pair_provenance.py cfb_moneyline_firstseen_diagnostic.py cfb_serving_builder_a.py
      - name: Actual frozen 2026 model raw-vs-context probability comparison
        run: |
          python -u cfb_moneyline_firstseen_diagnostic.py --out /tmp/cfb_moneyline_existing_fidelity.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cfb_moneyline_existing_fidelity.json'))
          assert x['status']=='OBSERVATIONAL_ALREADY_CONSULTED_NO_PROMOTION'
          assert x['all']['n']>=20
          assert x['paired_game_bootstrap95_for_served_minus_raw_brier'] is not None
          print('CFB paired pregame probabilities:',json.dumps(x['all'],sort_keys=True))
          print('GAME_CLUSTER_CI:',x['paired_game_bootstrap95_for_served_minus_raw_brier'])
          PY
      - name: Keep numerical forecasts and model artifacts unchanged
        run: |
          git diff --exit-code -- docs/cfb_predictions.json
          git diff --exit-code -- cfb_models
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-moneyline-original-firstseen-context-vs-raw
          path: /tmp/cfb_moneyline_existing_fidelity.json
          retention-days: 90
