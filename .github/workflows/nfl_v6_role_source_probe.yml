name: NFL V6 verified snap-role source probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nfl_v6_role_source_probe.yml
      - nfl_v6_snap_role_evidence.py
      - nfl_v6_joint_opportunity_shadow.py
      - nfl_v6_same_cohort_diagnostic.py
      - tests/test_nfl_v6b_role_shadow.py
      - tests/test_nfl_v6_snap_role_evidence.py
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install simulation runtime for as-of player join
        run: pip install numpy
      - name: Test source identity, real cutoff and role derivation
        run: python -m unittest discover -s tests -p 'test_nfl_v6_snap_role_evidence.py' -v
      - name: Test measured-role V6B challenger is isolated from original V6A
        run: python -m unittest discover -s tests -p 'test_nfl_v6b_role_shadow.py' -v
      - name: Retrieve actual nflverse PFR offensive snaps
        run: |
          set -euo pipefail
          for year in 2025 2026; do
            curl --fail --location --silent --show-error --retry 2 \
              "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_$year.csv" \
              -o "/tmp/nfl_snap_counts_$year.csv"
          done
          python - <<'PY'
          import csv,hashlib,json, pathlib
          for year in (2025,2026):
              p=pathlib.Path(f'/tmp/nfl_snap_counts_{year}.csv')
              with p.open() as f:
                  r=csv.DictReader(f)
                  print('NFL_V6_SNAP_HEADERS',year,r.fieldnames)
                  rows=list(r)
              hits=[x for x in rows if str(x.get('week')) in ('8','9')
                    and str(x.get('player','')).lower().find('jefferson')>=0]
              print('NFL_V6_SNAP_SOURCE',json.dumps({
                  'season':year,'bytes':p.stat().st_size,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'rows':len(rows),'jefferson_week8_9':hits[:6]}))
          PY
      - name: Derive real historical as-of snap role coverage
        run: |
          python nfl_v6_snap_role_evidence.py \
            --db nfl_models/nfl_model.sqlite --cutoff 2026-11-09T23:15:00Z \
            --files /tmp/nfl_snap_counts_2025.csv /tmp/nfl_snap_counts_2026.csv \
            --out /tmp/nfl_v6_snap_source_receipt.json
          python - <<'PY'
          from nfl_v6_snap_role_evidence import read_snap_roles,observed_role
          from nfl_v6_joint_opportunity_shadow import asof_rows
          import sqlite3,json
          db='nfl_models/nfl_model.sqlite'
          cutoff='2026-11-09T23:15:00Z'
          evidence=read_snap_roles(['/tmp/nfl_snap_counts_2025.csv',
            '/tmp/nfl_snap_counts_2026.csv'],db,cutoff)
          con=sqlite3.connect(db)
          rows=asof_rows(con,cutoff)
          con.close()
          jeff=[r for r in rows if r['name']=='Justin Jefferson' and r['team']=='MIN']
          role=observed_role(jeff,'Justin Jefferson','MIN',evidence)
          print('NFL_V6_VERIFIED_JEFFERSON_SNAP_ROLE',json.dumps(role))
          assert role['status']=='OBSERVED_ASOF_OFFENSE_SNAP_ROLE_NOT_ROUTE_DATA'
          assert role['matched']>=2
          assert role['route_participation_verified'] is False
          PY
      - name: Run 20k-real-game snap-role V6B research without promotion
        run: |
          python nfl_v6_joint_opportunity_shadow.py \
            --db nfl_models/nfl_model.sqlite --season 2026 --week 9 \
            --sims 20000 --snap-files \
            /tmp/nfl_snap_counts_2025.csv /tmp/nfl_snap_counts_2026.csv \
            --out /tmp/nfl_v6b_2026_w09.json
          python nfl_v6_same_cohort_diagnostic.py \
            --v6 /tmp/nfl_v6b_2026_w09.json \
            --firstseen docs/nfl_precision_firstseen.jsonl \
            --db nfl_models/nfl_model.sqlite \
            --out /tmp/nfl_v6b_same_cohort.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/nfl_v6b_2026_w09.json'))
          assert a['version']=='NFL_V6B_SNAP_ROLE_SHADOW_A'
          assert a['historical_snap_source_timestamps_asof_not_verified'] is True
          matched=sum(v.get('snap_source_role',{}).get('matched_candidates',0)
              for g in a['games'] for v in g['teams'].values())
          print('NFL_V6B_VERIFIED_SNAP_ROLE_MATCHES',matched)
          assert matched>=10
          game=next(g for g in a['games'] if {g['home'],g['away']}=={'BUF','MIN'})
          jeff=next(p for p in game['projections'] if p['player']=='Justin Jefferson'
                    and p['market']=='receiving_yards')
          print('NFL_V6B_JEFFERSON',json.dumps(jeff))
          b=json.load(open('/tmp/nfl_v6b_same_cohort.json'))
          assert b['promotion_eligible'] is False
          print('NFL_V6B_RESEARCH_PAIRED',json.dumps({
            'matched':b['matched'],'overall':b['overall'],
            'receiving':b['markets']['receiving_yards'],
            'rushing':b['markets']['rushing_yards']}))
          PY
      - name: Probe real 2026 FTN quarterback read and coverage charting source
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            "https://github.com/nflverse/nflverse-data/releases/download/ftn_charting/ftn_charting_2026.csv" \
            -o /tmp/nfl_ftn_charting_2026.csv
          python - <<'PY'
          import csv,hashlib,collections,json,pathlib
          p=pathlib.Path('/tmp/nfl_ftn_charting_2026.csv')
          with p.open() as stream:
              r=csv.DictReader(stream)
              print('NFL_V6_FTN_SOURCE_HEADER',json.dumps(r.fieldnames))
              samples=[]
              counts=collections.Counter()
              for row in r:
                  counts['rows']+=1
                  if row.get('week') in ('8','9') and len(samples)<3:
                      samples.append(row)
          print('NFL_V6_FTN_SOURCE_AUDIT',json.dumps({
              'rows':counts['rows'],'bytes':p.stat().st_size,
              'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'samples':samples}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-v6-verified-snap-source-receipt
          path: |
            /tmp/nfl_v6_snap_source_receipt.json
            /tmp/nfl_v6b_2026_w09.json
            /tmp/nfl_v6b_same_cohort.json
          if-no-files-found: ignore
