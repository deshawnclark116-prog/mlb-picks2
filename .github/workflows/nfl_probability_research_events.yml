name: NFL own-projection probability research contract
on:
  push:
    branches: [main]
    paths:
      - nfl_sim.py
      - nfl_target_grid.py
      - nfl_model_target_forward.py
      - tests/test_nfl_model_target_forward.py
      - nfl_serving_builder_a.py
      - tests/test_nfl_target_grid.py
      - tests/test_nfl_probability_research_events.py
      - .github/workflows/nfl_probability_research_events.yml
  pull_request:
    paths:
      - nfl_sim.py
      - nfl_target_grid.py
      - nfl_model_target_forward.py
      - tests/test_nfl_model_target_forward.py
      - nfl_serving_builder_a.py
      - tests/test_nfl_target_grid.py
      - tests/test_nfl_probability_research_events.py
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy requests xgboost pytest
      - name: Model-only event and >=10000-simulation source contract
        run: python -m pytest -q tests/test_nfl_probability_research_events.py tests/test_nfl_target_grid.py tests/test_nfl_model_target_forward.py tests/test_nfl_priced_yardage_numeric_contract.py tests/test_nfl_schedule_504_failover.py
      - name: No published source changes or sportsbook substitution
        run: python -m py_compile nfl_sim.py nfl_serving_builder_a.py
