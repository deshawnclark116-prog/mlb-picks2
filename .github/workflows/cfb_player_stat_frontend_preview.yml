name: CFB player stat frontend contract tests

on:
  push:
    branches:
      - feature/cfb-projections-frontend-bridge
    paths:
      - cfb_player_stat_frontend_bridge.py
      - tests/test_cfb_player_stat_frontend_bridge.py
      - docs/cfb_projections.html
      - .github/workflows/cfb_player_stat_frontend_preview.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent player stat presentation contract
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_cfb_player_stat_frontend_bridge.py
          python -m py_compile cfb_player_stat_frontend_bridge.py
          git diff --check
      - name: Verify standalone frontend source is clearly research-only
        run: |
          python - <<'PY'
          from pathlib import Path
          template=Path("docs/cfb_projections.html").read_text()
          assert 'cfb-player-stat-projections-research-v1' in template
          assert 'RESEARCH' in template
          assert '3-GAME' in template
          assert 'MONTE CARLO' in template
          assert 'cfb_player_stat_projections.json' in template
          print("CFB research-only player-stat UI contract verified")
          PY
