name: NFL V2 Phase1L QB opportunity research source gate

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_v2_phase1l_*.py"
      - "tests/test_nfl_v2_phase1l_*.py"
      - "nfl_models/nfl_player_outcome_v2/phase1l_*"
      - ".github/workflows/nfl_v2_phase1l_qb_opportunity.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: pip install numpy==2.3.5 pytest
      - name: Deterministic tests and protected-history checks
        run: |
          python -m pytest -q tests/test_nfl_v2_*.py
          python tests/test_nfl_v2_phase0_audit.py
          python tests/test_nfl_v2_phase0_baselines.py
          python tests/test_nfl_v2_phase1a_direct.py
      - name: Reproduce starter/source gate before fitting
        run: |
          python -u nfl_v2_phase1l_qb_sources.py --fetch --data-dir /tmp/phase1l-data --out /tmp/phase1l-audit.json
          cmp nfl_models/nfl_player_outcome_v2/phase1l_qb_source_audit.json /tmp/phase1l-audit.json
      - name: Freeze benchmark definition and 2024 development stop
        run: |
          python -u nfl_v2_phase1l_qb_opportunity.py --data-dir /tmp/phase1l-data --stage develop --audit /tmp/phase1l-audit.json --lock /tmp/phase1l-lock.json --benchmark /tmp/phase1l-human.json
          cmp nfl_models/nfl_player_outcome_v2/phase1l_development_lock.json /tmp/phase1l-lock.json
          cmp nfl_models/nfl_player_outcome_v2/phase1l_competent_human_qb_volume.json /tmp/phase1l-human.json
      - name: Respect conditional confirmation and independent workload gates
        run: |
          # Source gate failed: the frozen runner records NOT_RUN and opens
          # 2023/2024 only. It never executes 2025/2026 scoring, yards or oracles.
          # Changed state data requires a NEW protocol, not a boolean override.
          python -u nfl_v2_phase1l_qb_opportunity.py --data-dir /tmp/phase1l-data --stage confirm --audit /tmp/phase1l-audit.json --lock /tmp/phase1l-lock.json --out /tmp/phase1l-results.json --receipts /tmp/phase1l-receipts.jsonl.gz
          cmp nfl_models/nfl_player_outcome_v2/phase1l_qb_results.json /tmp/phase1l-results.json
          cmp nfl_models/nfl_player_outcome_v2/phase1l_qb_receipts.jsonl.gz /tmp/phase1l-receipts.jsonl.gz
      - name: Compact result on existing PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const r=JSON.parse(fs.readFileSync('/tmp/phase1l-results.json','utf8'));
            let body='<!-- nfl-phase1l-qb -->\n## Phase1L-QB opportunity source gate\n';
            body+=`Head: \`${context.payload.pull_request.head.sha}\`\n\n**${r.verdict}**. No accepted 2024 pregame expected-starter/health version archive. Prior passer dominance is a hint, not current starter certification.\n\n`;
            body+='All A–G families: BLOCKED, not scored/rejected on performance. Competent-human four-stage benchmark is frozen and unscored. Practical future gate: max(1 attempt, 5%) MAE improvement versus strongest comparator plus paired game-block evidence.\n\n';
            for(const [label,p] of Object.entries(r.periods))body+=`${label}: **${p.status}**.\n\n`;
            body+=`Raw 2024 state-audit receipts: ${r.raw_audit_ledger.rows}; prior continuity hints: ${r.raw_audit_ledger.prior_continuity_hints}; certifiable primary starter rows: 0; model-scored rows: 0.\n\n`;
            body+='Passing yards: '+r.full_passing_yards.status+'. Oracles: '+r.oracle_decomposition.status+'.\n\n';
            body+='Only pinned 2023/2024 PBP/stats opened. No 2025/2026 scoring, Week5+, sportsbooks, Monte Carlo, paid sources, production changes or receiving/rushing rescue. New data acceptance/preregistration required to reopen.\n';
            const params={...context.repo,issue_number:context.issue.number};
            const comments=await github.paginate(github.rest.issues.listComments,params);
            const old=comments.find(c=>c.user.type==='Bot'&&c.body?.includes('<!-- nfl-phase1l-qb -->'));
            if(old)await github.rest.issues.updateComment({...context.repo,comment_id:old.id,body});
            else await github.rest.issues.createComment({...params,body});
      - name: Upload research audit, benchmark, lock, results and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v2-phase1l-qb-opportunity
          path: |
            /tmp/phase1l-audit.json
            /tmp/phase1l-human.json
            /tmp/phase1l-lock.json
            /tmp/phase1l-results.json
            /tmp/phase1l-receipts.jsonl.gz
          if-no-files-found: warn
