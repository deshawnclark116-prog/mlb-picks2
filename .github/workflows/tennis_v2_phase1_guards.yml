name: Tennis V2 Phase1A causal guards (research only)

on:
  push:
    branches:
      - codex/tennis-v2-phase1-moneyline
    paths:
      - tennis_v2_phase1_guards.py
      - tennis_v2_phase1_scoring.py
      - tests/test_tennis_v2_phase1_guards.py
      - tests/test_tennis_v2_phase1_scoring.py
      - tennis_models/tennis_outcome_engine_v2/phase1_protocol.json
      - .github/workflows/tennis_v2_phase1_guards.yml
  pull_request:
    paths:
      - tennis_v2_phase1_guards.py
      - tennis_v2_phase1_scoring.py
      - tests/test_tennis_v2_phase1_guards.py
      - tests/test_tennis_v2_phase1_scoring.py
      - tennis_models/tennis_outcome_engine_v2/phase1_protocol.json
      - .github/workflows/tennis_v2_phase1_guards.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1a-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic causal and safety tests
        run: python -m unittest discover -s tests -p 'test_tennis_v2_phase1_*.py' -v
      - name: Ensure no 2025 outcome access in test harness
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          files = ['tennis_v2_phase1_guards.py', 'tennis_v2_phase1_scoring.py', 'tests/test_tennis_v2_phase1_guards.py', 'tests/test_tennis_v2_phase1_scoring.py']
          for fname in files:
              source = Path(fname).read_text()
              ast.parse(source)
              assert 'urllib' not in source and 'requests' not in source
          print('Phase1 guard and test harness: no network or source-file readers')
          PY
