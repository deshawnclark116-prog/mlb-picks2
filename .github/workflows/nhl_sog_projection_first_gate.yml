name: NHL fixed-line SOG quarantine and count projection contract

on:
  push:
    branches: [fix/nhl-projection-first-unpriced-sog-quarantine]
    paths:
      - 'nhl_sog_publication_gate_a.py'
      - 'nhl_sog_projection_contract_a.py'
      - 'nhl_serving_builder_a.py'
      - 'nhl_grade_record_a.py'
      - 'tests/test_nhl_sog_publication_gate_a.py'
      - 'tests/test_nhl_sog_projection_contract_a.py'
      - '.github/workflows/nhl_sog_projection_first_gate.yml'
  pull_request:
    paths:
      - 'nhl_sog_publication_gate_a.py'
      - 'nhl_sog_projection_contract_a.py'
      - 'nhl_serving_builder_a.py'
      - 'nhl_grade_record_a.py'
      - 'tests/test_nhl_sog_publication_gate_a.py'
      - 'tests/test_nhl_sog_projection_contract_a.py'
      - '.github/workflows/nhl_sog_projection_first_gate.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fail-closed-sog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only minimal test dependencies
        run: python -m pip install pytest
      - name: Audit actual archived Oct 10 mass-UNDER board and all new fail-closed contracts
        run: |
          python -m pytest -q tests/test_nhl_sog_publication_gate_a.py tests/test_nhl_sog_projection_contract_a.py
      - name: Static compilation and no historical forecast changes
        run: |
          python -m py_compile nhl_serving_builder_a.py nhl_grade_record_a.py nhl_sog_publication_gate_a.py nhl_sog_projection_contract_a.py
          git diff --check
          git diff --exit-code -- docs/nhl_predictions.json docs/nhl_picks_log.jsonl nhl_models

  isolated-builder-smoke:
    needs: fail-closed-sog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing NHL builder runtime dependencies
        run: python -m pip install numpy scipy xgboost requests
      - name: Rebuild archived Oct 10 NHL slate with isolated log and publication destination
        run: |
          python - <<'PY'
          import json, os, shutil, sqlite3, sys
          from pathlib import Path
          import nhl_serving_builder_a as B
          from nhl_sog_publication_gate_a import SOG_CLASSIFIERS, fail_closed_official_sog

          if not Path("nhl_models/nhl_model.sqlite").is_file():
              raise RuntimeError("NHL_FOUNDATION_DB_MISSING_FROM_SMOKE")
          tmp = Path(os.environ["RUNNER_TEMP"]) / "nhl_builder_safe"
          tmp.mkdir(parents=True, exist_ok=True)
          test_log = tmp / "original_log_copy.jsonl"
          if B.PICKS_LOG_PATH.exists():
              shutil.copy2(B.PICKS_LOG_PATH, test_log)
          B.PICKS_LOG_PATH = test_log
          # Repository's checked-in foundation DB is intentionally older than
          # the live foundation refresh. Migrate ONLY a temporary copy and
          # restore already-archived game start times: no external fetch.
          scratch_db = tmp / "isolated_nhl.sqlite"
          shutil.copy2("nhl_models/nhl_model.sqlite", scratch_db)
          with sqlite3.connect(str(scratch_db)) as conn:
              cols = {r[1] for r in conn.execute("PRAGMA table_info(games)")}
              if "kickoff_utc" not in cols:
                  conn.execute("ALTER TABLE games ADD COLUMN kickoff_utc TEXT")
              archive = json.loads(
                  Path("docs/nhl_predictions_2026_2026-10-10.json").read_text()
              )
              match_times = {}
              for candidate in archive["picks"]:
                  home, away = candidate.get("team"), candidate.get("opponent")
                  start = candidate.get("kickoff_utc")
                  if home and away and start:
                      key = tuple(sorted((home,away)))
                      if key in match_times and match_times[key] != start:
                          raise RuntimeError("CONFLICTING_ORIGINAL_SCHEDULE_KICKOFF")
                      match_times[key] = start
              for (team1,team2), kickoff in match_times.items():
                  conn.execute(
                      "UPDATE games SET kickoff_utc=? WHERE game_date=? AND "
                      "((home_abbrev=? AND away_abbrev=?) OR "
                      "(home_abbrev=? AND away_abbrev=?))",
                      (kickoff,"2026-10-10",team1,team2,team2,team1),
                  )
              conn.commit()
          # Historical snapshot in tmp only; NO docs or training files can be written.
          sys.argv = [
              "nhl_serving_builder_a.py", "--db", str(scratch_db),
              "--date", "2026-10-10",
              "--out", str(tmp / "nhl_predictions.json"),
          ]
          B.main()
          board = json.loads((tmp / "nhl_predictions.json").read_text())
          audit = board.get("nhl_sog_publication_integrity")
          if not audit:
              raise RuntimeError("NHL_PUBLISH_AUDIT_MISSING")
          if audit["official_shots_on_goal_picks"] != 0:
              raise RuntimeError("NHL_SOG_STILL_ON_PUBLIC_BOARD")
          fail_closed_official_sog(board["picks"])
          if any(p["market"] in SOG_CLASSIFIERS for p in board["picks"]):
              raise RuntimeError("UNVERIFIED_LEGACY_SOG_LEAK")
          # The official headline record must not silently retain
          # hundreds of unverified historical 2.5-shot classifier hits.
          import nhl_grade_record_a as G
          G.DB_DEFAULT = scratch_db
          G.LOG_DEFAULT = test_log
          G.OUT_DEFAULT = tmp / "nhl_record.json"
          G.main()
          record = json.loads(G.OUT_DEFAULT.read_text())
          legacy = record["legacy_fixed_line_sog_research"]
          # Checked-in SQLite intentionally does not contain final 2026
          # box scores from the live refresh; zero graded rows is expected.
          # The original pregame ledger MUST still retain its old SOG
          # records, and the derived scope split must conserve any results.
          with test_log.open() as original_lines:
              if not any(
                  json.loads(line).get("market") in SOG_CLASSIFIERS
                  for line in original_lines if line.strip()
              ):
                  raise RuntimeError("NHL_ORIGINAL_HISTORICAL_SOG_LEDGER_LOST")
          if any(p["market"] in SOG_CLASSIFIERS for p in record["results"]):
              raise RuntimeError("UNPRICED_SOG_IN_ACTIVE_GRADE_RESULT")
          if record["all_original_graded_rows_preserved"] != (
              record["summary"]["total"] + legacy["summary"]["total"]
          ):
              raise RuntimeError("ORIGINAL_NHL_GRADED_ROWS_NOT_PRESERVED")
          print(json.dumps({
              "active_historical_grades": record["summary"]["total"],
              "legacy_unpriced_historical_grades": legacy["summary"]["total"],
              "historical_grading_scope_integrity": True,
          }, sort_keys=True))
          print(json.dumps({
              "pre_existing_historical_docs_untouched": True,
              "old_unverified_sog_quarantined": audit["removed_total"],
              "conflicting_player_groups": audit["contradictory_player_game_groups"],
              "other_markets_published": len(board["picks"]),
              "daily_board": str(tmp / "nhl_predictions_2026_2026-10-10.json"),
          }, sort_keys=True))
          PY
          git diff --exit-code -- docs nhl_models
