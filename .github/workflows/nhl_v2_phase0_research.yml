name: NHL V2 Phase0 research

# Research only. Never deploys, never touches production NHL files, never publishes picks.
on:
  push:
    branches: ["codex/nhl-outcome-engine-v2"]
    paths:
      - "nhl_v2_*.py"
      - "tests/test_nhl_v2_*.py"
      - "nhl_models/nhl_player_outcome_v2/**"
      - "requirements-research-nhl.txt"
      - ".github/workflows/nhl_v2_phase0_research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: pip install -r requirements-research-nhl.txt
      - name: Tests (firewall, chronology ordering, metrics, artifact integrity)
        run: python -m pytest -q tests/test_nhl_v2_phase0.py
      - name: Reproduce Phase0 audit and compare numerically with committed artifacts
        run: |
          python nhl_v2_phase0_audit.py "$RUNNER_TEMP/p0"
          python - <<'PY'
          import gzip, json, os, sys
          tmp = os.environ["RUNNER_TEMP"] + "/p0/"; ref = "nhl_models/nhl_player_outcome_v2/"
          SKIP = ("reliability", "reliability_table")
          def eq(a, b, path=""):
              if isinstance(a, dict):
                  assert set(a) == set(b), path
                  for k in a:
                      if k in SKIP or k.endswith("sha256") or k == "artifact_sha256": continue
                      eq(a[k], b[k], path + "/" + k)
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): eq(x, y, path + "/%d" % i)
              elif isinstance(a, float) or isinstance(b, float):
                  assert abs(a - b) <= 1e-4 * max(1.0, abs(a), abs(b)), (path, a, b)
              else:
                  assert a == b, (path, a, b)
          bad = 0
          for f in sorted(os.listdir(tmp)):
              try:
                  if f.endswith(".json") and f != "phase0_snapshot.json":
                      eq(json.load(open(tmp + f)), json.load(open(ref + f)))
                  elif f.endswith(".jsonl.gz"):
                      n1 = len(gzip.decompress(open(tmp + f, "rb").read()).splitlines()); n2 = len(gzip.decompress(open(ref + f, "rb").read()).splitlines())
                      assert abs(n1 - n2) <= max(3, int(0.001 * n2)), (f, n1, n2)
              except AssertionError as e:
                  print("::error::artifact differs:", f, e); bad = 1
          sys.exit(bad)
          PY
