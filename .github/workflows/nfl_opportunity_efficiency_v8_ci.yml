name: NFL V8 opportunity × efficiency actual-game challenger
on:
  pull_request:
    paths:
      - nfl_opportunity_efficiency_v8_research.py
      - tests/test_nfl_opportunity_efficiency_v8.py
      - .github/workflows/nfl_opportunity_efficiency_v8_ci.yml
  push:
    branches: [research/nfl-opportunity-efficiency-v8-20261122]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  historical-nfl-role-projection-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-input numpy xgboost requests
      - name: Verify no future boxscore, correct opportunity and markets
        run: |
          python -m py_compile nfl_opportunity_efficiency_v8_research.py
          python -m unittest discover -s tests -p test_nfl_opportunity_efficiency_v8.py -v
      - name: Read original multi-year NFL game stats into a separate temporary DB
        run: |
          set -euo pipefail
          python -u nfl_player_games_foundation_a.py \
            --season 2022 2023 2024 2025 2026 \
            --db /tmp/nfl_v8_challenger_source.sqlite
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect("file:/tmp/nfl_v8_challenger_source.sqlite?mode=ro",uri=True)
          years=dict(c.execute("SELECT season,COUNT(*) FROM player_games WHERE season_type='REG' GROUP BY season"))
          print("NFL_V8_CLEAN_SEASONS",years)
          assert all(years.get(y,0)>100 for y in (2023,2024,2025,2026))
          c.close()
          PY
      - name: Backtest every eligible row against frozen V2 and plain average
        run: |
          python -u nfl_opportunity_efficiency_v8_research.py \
            --db /tmp/nfl_v8_challenger_source.sqlite \
            --out /tmp/nfl_v8_opportunity_efficiency_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-v8-source-exact-forward-challenger-report
          path: /tmp/nfl_v8_opportunity_efficiency_report.json
          if-no-files-found: ignore
          retention-days: 21
