name: CBB game outcomes research (moneylines spreads totals)
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - cbb_game_engine_v0.py
      - tests/test_cbb_game_engine_v0.py
      - .github/workflows/cbb_game_outcomes_research.yml
      - docs/research/cbb_game_outcomes_contract.md
permissions:
  contents: read
concurrency:
  group: cbb-game-outcomes-research
  cancel-in-progress: true
jobs:
  validate_and_forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model and file dependencies
        run: python -m pip install numpy pandas scikit-learn pyarrow
      - name: Run historical-integrity, moneyline, spread and total contracts
        run: |
          python -m unittest discover -s tests -p test_cbb_game_engine_v0.py -v
          python -m py_compile cbb_game_engine_v0.py
      - name: Download authentic men's CBB season game and player sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cbb_input"
          for season in 2023 2024 2025 2026 2027; do
            for spec in \
              "espn_mens_college_basketball_team_boxscores team_box" \
              "espn_mens_college_basketball_player_boxscores player_box" \
              "espn_mens_college_basketball_schedules mbb_schedule"; do
              read -r tag stem <<< "$spec"
              file="$stem"_"$season".parquet
              curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
                --max-time 240 \
                "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/$tag/$file" \
                -o "$RUNNER_TEMP/cbb_input/$file"
              test -s "$RUNNER_TEMP/cbb_input/$file"
            done
          done
      - name: Run chronological training, validation, holdout and upcoming games
        run: |
          set -euo pipefail
          set --
          for y in 2023 2024 2025 2026 2027; do
            set -- "$@" --team-box "$RUNNER_TEMP/cbb_input/team_box_$y.parquet"
            set -- "$@" --player-box "$RUNNER_TEMP/cbb_input/player_box_$y.parquet"
            set -- "$@" --schedule "$RUNNER_TEMP/cbb_input/mbb_schedule_$y.parquet"
          done
          python cbb_game_engine_v0.py "$@" --out /tmp/cbb_game_predictions_research.json
      - name: Fail visibly if a historic test or forecast is missing
        run: |
          python - <<'PY'
          import json,pathlib
          f=pathlib.Path("/tmp/cbb_game_predictions_research.json")
          j=json.loads(f.read_text())
          test=j["report"]["untouched_2026_holdout"]
          print("CBB_HOLDOUT:",json.dumps(test,sort_keys=True))
          print("CBB_UPCOMING_GAME_COUNT:",len(j["game_predictions"]))
          assert j["no_live_frontend_or_production_changes"] is True
          assert j["status"]=="RESEARCH_ONLY_NO_PRETIP_FIRST_SEEN_ARCHIVE"
          assert test["games"]>=500
          assert len(j["game_predictions"])>0, "NO_UPCOMING_CBB_GAMES"
          assert all(0<=p["p_home_win"]<=1 and p["p_home_cover"] is None and p["p_over"] is None
                     for p in j["game_predictions"])
          PY
      - name: Preserve actual CBB probabilities and historical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-game-research
          path: /tmp/cbb_game_predictions_research.json
          if-no-files-found: warn
          retention-days: 30
