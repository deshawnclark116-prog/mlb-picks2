name: CFB 2026 event data qualification (research, no serving)

on:
  push:
    branches: [research/cfb-2026-event-source-qualification]
    paths:
      - 'cfb_2026_event_source_qualify_a.py'
      - 'tests/test_cfb_2026_event_source_qualify_a.py'
      - '.github/workflows/cfb_2026_event_qualification.yml'
      - 'docs/research/CFB_2026_EVENT_SOURCE_QUALIFICATION.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cfb-2026-event-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-2026-play-source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial local integrity tests and existing extraction syntax
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_cfb_2026_event_source_qualify_a.py
          python -m py_compile cfb_2026_event_source_qualify_a.py cfb_rushing_yards_carry_extraction_a.py cfb_pass_recv_event_extraction_a.py
      - name: Capture current 2026 source bytes in isolated temporary directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfb_raw" research_out
          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/schedules/csv/cfb_schedules_2026.csv" \
            -o "$RUNNER_TEMP/cfb_raw/schedules_2026.csv"
          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/player_stats/csv/player_stats_2026.csv" \
            -o "$RUNNER_TEMP/cfb_raw/player_stats_2026.csv"
          test -s "$RUNNER_TEMP/cfb_raw/schedules_2026.csv"
          test -s "$RUNNER_TEMP/cfb_raw/player_stats_2026.csv"
          sha256sum "$RUNNER_TEMP/cfb_raw/"*.csv
      - name: Reconstruct independently refreshed 2026 ESPN game/box-score truth in temporary DB
        run: |
          cp cfb_models/cfb_model.sqlite "$RUNNER_TEMP/cfb_qualify_model.sqlite"
          python -u cfb_espn_live_foundation_a.py \
            --season 2026 --db "$RUNNER_TEMP/cfb_qualify_model.sqlite"
      - name: Extract actual event distributions without modifying main or production
        run: |
          python -u cfb_rushing_yards_carry_extraction_a.py \
            --season 2026 --raw-dir "$RUNNER_TEMP/cfb_raw" \
            --db "$RUNNER_TEMP/cfb_research_events.sqlite"
          python -u cfb_pass_recv_event_extraction_a.py \
            --season 2026 --raw-dir "$RUNNER_TEMP/cfb_raw" \
            --db "$RUNNER_TEMP/cfb_research_events.sqlite"
      - name: Audit real event coverage against independently rebuilt game and player stats
        run: |
          python -u cfb_2026_event_source_qualify_a.py \
            --model-db "$RUNNER_TEMP/cfb_qualify_model.sqlite" \
            --event-db "$RUNNER_TEMP/cfb_research_events.sqlite" \
            --schedule-csv "$RUNNER_TEMP/cfb_raw/schedules_2026.csv" \
            --player-csv "$RUNNER_TEMP/cfb_raw/player_stats_2026.csv" \
            --out research_out/cfb_2026_event_qualification.json
          git diff --exit-code -- cfb_models docs/cfb_predictions.json docs/cfb_picks_log.jsonl docs/cfb_record.json
      - name: Archive exact data-source bytes and quarantine/coverage report, for later reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-event-source-research-only
          path: |
            research_out/cfb_2026_event_qualification.json
            ${{ runner.temp }}/cfb_raw/schedules_2026.csv
            ${{ runner.temp }}/cfb_raw/player_stats_2026.csv
          retention-days: 30
          if-no-files-found: warn
