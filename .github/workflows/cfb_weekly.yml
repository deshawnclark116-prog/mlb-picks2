name: Weekly CFB Predictions

on:
  schedule:
    # Mirrors nfl_weekly.yml's reasoning exactly: CFB games cluster
    # Thu-Sat, cfbfastR-data itself only updates 1-2x/day (confirmed via
    # its own commit history), so a Tuesday capture after the weekend's
    # games have settled is the honest cadence, not a compromise. Runs
    # year-round: in the offseason the builder writes an empty board.
    - cron: "0 15 * * 2"   # 10:00 ET Tuesday (1h after the NFL run, same runner class)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy xgboost

      - name: Refresh foundation data from cfbfastR-data
        # Stateless rebuild into the repo-backed db path. Seasons: the
        # serving season and the one before it (walk-forward warmup pool).
        # --raw-dir points into the runner's tmp space (not /data, which
        # isn't guaranteed writable on GitHub-hosted runners).
        run: |
          python -u cfb_player_games_foundation_a.py \
            --season 2025 2026 \
            --raw-dir /tmp/cfb_raw \
            --db cfb_models/cfb_model.sqlite

      - name: Self-test serving engine (parity with validated pipeline)
        # Runs against the validation data (2022-2025) ONLY if still
        # present; a refreshed db without those seasons skips cleanly
        # rather than blocking the board build. In practice this weekly
        # job's own fetch above (--season 2025 2026 only) never has
        # 2022-2023, so this step is a documented no-op here -- it exists
        # for anyone running the workflow against a db with fuller history.
        run: |
          python - <<'EOF'
          import sqlite3, subprocess, sys
          con = sqlite3.connect("file:cfb_models/cfb_model.sqlite?mode=ro", uri=True)
          seasons = {r[0] for r in con.execute("SELECT DISTINCT season FROM player_games")}
          con.close()
          needed = {2022, 2023, 2024, 2025}
          if needed <= seasons:
              sys.exit(subprocess.call(
                  ["python", "-u", "cfb_serving_builder_a.py", "--selftest"]))
          print(f"seasons in db: {sorted(seasons)} -- {sorted(needed - seasons)} "
                "validation data not present, skipping parity self-test")
          EOF

      - name: Build weekly board
        run: python -u cfb_serving_builder_a.py

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "CFB weekly board $(date -u +%F)" || echo "nothing to commit"
          git push
