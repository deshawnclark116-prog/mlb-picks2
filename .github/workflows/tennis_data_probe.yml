name: Tennis Data Probe (diagnostic)

# One-off, manually triggered diagnostic: this session's interactive
# sandbox couldn't reach JeffSackmann/tennis_atp or tennis_wta (GitHub
# access here is scoped to a different repo owner, and cross-owner repo
# attachment isn't supported), so tennis_player_matches_foundation_a.py's
# column-name mapping was written from documented public schema, not a
# live fetch-and-inspect. This runner has normal internet access (same
# as nflverse/cfbfastR already get in all_sports_predictions.yml), so it
# does what the interactive session couldn't: confirm the schema is
# right, then pull enough real seasons to build+gate the tennis markets
# against, uploaded as an artifact for that gate work. Safe to delete
# once tennis has its own real weekly/live workflow step.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover real branch name and file listing (raw_matches_2024.csv 404'd on 'master')
        run: |
          echo "--- tennis_atp: repo existence + default branch ---"
          curl -sI https://github.com/JeffSackmann/tennis_atp | head -1
          git ls-remote --symref https://github.com/JeffSackmann/tennis_atp HEAD || echo "tennis_atp ls-remote FAILED"
          echo
          echo "--- tennis_wta: repo existence + default branch ---"
          curl -sI https://github.com/JeffSackmann/tennis_wta | head -1
          git ls-remote --symref https://github.com/JeffSackmann/tennis_wta HEAD || echo "tennis_wta ls-remote FAILED"
          echo
          echo "--- tennis_MatchChartingProject (known to exist per a real Apr-2026 GH issue) ---"
          curl -sI https://github.com/JeffSackmann/tennis_MatchChartingProject | head -1
          echo
          echo "--- JeffSackmann user profile: does the account itself still exist? ---"
          curl -s https://api.github.com/users/JeffSackmann | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('login'), d.get('type'), d.get('message'))"
          echo
          echo "--- JeffSackmann's current public repo list ---"
          curl -s "https://api.github.com/users/JeffSackmann/repos?per_page=100" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          if isinstance(d, list):
              for r in d:
                  print(r['name'], '-', r.get('description') or '')
          else:
              print(d)
          "
          echo
          echo "--- Tennismylife/TML-Database: real alternative? ---"
          curl -sI https://github.com/Tennismylife/TML-Database | head -1
          git clone --depth 1 https://github.com/Tennismylife/TML-Database /tmp/tml_probe 2>&1 | tail -5
          echo "files:"
          ls /tmp/tml_probe 2>/dev/null | head -20
          echo "sample match csv header (if present):"
          find /tmp/tml_probe -iname "*match*.csv" | head -3 | xargs -I{} sh -c 'echo "== {} =="; head -1 "{}"'

      - name: Confirm Sackmann CSV schema matches what the foundation script expects
        run: python -u tennis_player_matches_foundation_a.py --seasons 2024 --selftest-schema --raw-dir tennis_raw

      - name: Ingest real ATP+WTA history (2015-2024) for champion-gate work
        run: |
          python -u tennis_player_matches_foundation_a.py \
            --seasons 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 \
            --tours atp wta \
            --raw-dir tennis_raw \
            --db tennis_models/tennis_model.sqlite

      - name: Report row counts
        run: |
          python3 -c "
          import sqlite3
          con = sqlite3.connect('tennis_models/tennis_model.sqlite')
          print('matches:', con.execute('SELECT COUNT(*) FROM matches').fetchone()[0])
          print('player_matches:', con.execute('SELECT COUNT(*) FROM player_matches').fetchone()[0])
          print(con.execute('SELECT tour, COUNT(*) FROM player_matches GROUP BY tour').fetchall())
          print(con.execute('SELECT surface, COUNT(*) FROM player_matches GROUP BY surface').fetchall())
          "

      - uses: actions/upload-artifact@v4
        with:
          name: tennis_model_sqlite
          path: tennis_models/tennis_model.sqlite
          retention-days: 7
