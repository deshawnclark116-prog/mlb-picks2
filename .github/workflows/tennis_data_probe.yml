name: Tennis Data Probe (diagnostic)

# One-off, manually triggered diagnostic: this session's interactive
# sandbox couldn't reach JeffSackmann/tennis_atp or tennis_wta (GitHub
# access here is scoped to a different repo owner, and cross-owner repo
# attachment isn't supported), so tennis_player_matches_foundation_a.py's
# column-name mapping was written from documented public schema, not a
# live fetch-and-inspect. This runner has normal internet access (same
# as nflverse/cfbfastR already get in all_sports_predictions.yml), so it
# does what the interactive session couldn't: confirm the schema is
# right, then pull enough real seasons to build+gate the tennis markets
# against, uploaded as an artifact for that gate work. Safe to delete
# once tennis has its own real weekly/live workflow step.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover real branch name and file listing (raw_matches_2024.csv 404'd on 'master')
        run: |
          echo "--- tennis_atp: repo existence + default branch ---"
          curl -sI https://github.com/JeffSackmann/tennis_atp | head -1
          git ls-remote --symref https://github.com/JeffSackmann/tennis_atp HEAD || echo "tennis_atp ls-remote FAILED"
          echo
          echo "--- tennis_wta: repo existence + default branch ---"
          curl -sI https://github.com/JeffSackmann/tennis_wta | head -1
          git ls-remote --symref https://github.com/JeffSackmann/tennis_wta HEAD || echo "tennis_wta ls-remote FAILED"
          echo
          echo "--- tennis_MatchChartingProject (known to exist per a real Apr-2026 GH issue) ---"
          curl -sI https://github.com/JeffSackmann/tennis_MatchChartingProject | head -1
          echo
          echo "--- JeffSackmann user profile: does the account itself still exist? ---"
          curl -s https://api.github.com/users/JeffSackmann | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('login'), d.get('type'), d.get('message'))"
          echo
          echo "--- JeffSackmann's current public repo list ---"
          curl -s "https://api.github.com/users/JeffSackmann/repos?per_page=100" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          if isinstance(d, list):
              for r in d:
                  print(r['name'], '-', r.get('description') or '')
          else:
              print(d)
          "
          echo
          echo "--- Tennismylife/TML-Database: real alternative? ---"
          curl -sI https://github.com/Tennismylife/TML-Database | head -1
          curl -s https://api.github.com/repos/Tennismylife/TML-Database | python3 -c "import json,sys; d=json.load(sys.stdin); print('default_branch:', d.get('default_branch'))"
          curl -sI https://raw.githubusercontent.com/Tennismylife/TML-Database/master/2024.csv | head -1
          git clone --depth 1 https://github.com/Tennismylife/TML-Database /tmp/tml_probe 2>&1 | tail -5
          echo "all files:"
          ls /tmp/tml_probe
          echo "most recent year's header + a data row:"
          latest=$(ls /tmp/tml_probe | grep -E '^[0-9]{4}\.csv$' | sort -n | tail -1)
          echo "latest file: $latest"
          head -2 "/tmp/tml_probe/$latest"
          echo "row count: $(wc -l < "/tmp/tml_probe/$latest")"
          echo "README (first 60 lines):"
          cat /tmp/tml_probe/README.md 2>/dev/null | head -60

      - name: Confirm TML-Database CSV schema matches what the foundation script expects
        run: python -u tennis_player_matches_foundation_a.py --seasons 2024 --tours atp --selftest-schema --raw-dir tennis_raw

      - name: Ingest real ATP history (2015-2024) for champion-gate work
        run: |
          python -u tennis_player_matches_foundation_a.py \
            --seasons 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 \
            --tours atp \
            --raw-dir tennis_raw \
            --db tennis_models/tennis_model.sqlite

      - name: Report row counts
        run: |
          python3 -c "
          import sqlite3
          con = sqlite3.connect('tennis_models/tennis_model.sqlite')
          print('matches:', con.execute('SELECT COUNT(*) FROM matches').fetchone()[0])
          print('player_matches:', con.execute('SELECT COUNT(*) FROM player_matches').fetchone()[0])
          print(con.execute('SELECT tour, COUNT(*) FROM player_matches GROUP BY tour').fetchall())
          print(con.execute('SELECT surface, COUNT(*) FROM player_matches GROUP BY surface').fetchall())
          "

      - uses: actions/upload-artifact@v4
        with:
          name: tennis_model_sqlite
          path: tennis_models/tennis_model.sqlite
          retention-days: 7

      - name: Check real tennis odds coverage (The Odds API + odds-api.io)
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return {"error": str(e)}

          the_odds_key = os.environ.get("THE_ODDS_API_KEY", "")
          print("--- The Odds API: /v4/sports (looking for tennis) ---")
          if not the_odds_key:
              print("no THE_ODDS_API_KEY set")
          else:
              sports = get(f"https://api.the-odds-api.com/v4/sports/?apiKey={the_odds_key}&all=true")
              if isinstance(sports, list):
                  tennis = [s for s in sports if "tennis" in s.get("key", "").lower()]
                  print(f"{len(sports)} total sports, {len(tennis)} tennis-related:")
                  for t in tennis:
                      print(" ", t.get("key"), "-", t.get("title"), "- active:", t.get("active"))
                  for t in tennis:
                      if not t.get("active"):
                          continue
                      key = t["key"]
                      odds = get(f"https://api.the-odds-api.com/v4/sports/{key}/odds/"
                                  f"?apiKey={the_odds_key}&regions=us&markets=h2h,totals")
                      if isinstance(odds, list):
                          print(f"    {key}: {len(odds)} live events, sample markets:",
                                {m["key"] for e in odds[:3] for bk in e.get("bookmakers", [])
                                 for m in bk.get("markets", [])})
                      else:
                          print(f"    {key}: {odds}")
                      # The invalid-market-key trick doesn't surface a
                      # valid-list here (plain 422, no detail) -- try
                      # plausible real candidate market keys directly.
                      for candidate in ["set_betting", "correct_score", "spreads",
                                        "player_props", "alternate_totals"]:
                          r = get(f"https://api.the-odds-api.com/v4/sports/{key}/odds/"
                                  f"?apiKey={the_odds_key}&regions=us&markets={candidate}")
                          if isinstance(r, list) and r and any(
                                  bk.get("markets") for e in r for bk in e.get("bookmakers", [])):
                              print(f"    {key} candidate '{candidate}': FOUND DATA",
                                    json.dumps(r[0].get("bookmakers", []))[:500])
                          else:
                              print(f"    {key} candidate '{candidate}':", json.dumps(r)[:200])
              else:
                  print("response:", sports)

          io_key = os.environ.get("ODDS_API_IO_KEY", "")
          print()
          print("--- odds-api.io: /v3/sports (looking for tennis) ---")
          if not io_key:
              print("no ODDS_API_IO_KEY set")
          else:
              sports = get(f"https://api.odds-api.io/v3/sports?apiKey={io_key}")
              print("response:", json.dumps(sports)[:2000])
          EOF
