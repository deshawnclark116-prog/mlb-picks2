name: NFL CURRENT TEAM ROLE safety regression
on:
  pull_request:
    paths:
      - nfl_yardage_v2.py
      - nfl_current_team_role_guard.py
      - nfl_serving_builder_a.py
      - tests/test_nfl_recent_current_team_role.py
      - .github/workflows/nfl_current_team_role_ci.yml
  push:
    branches: [fix/nfl-current-team-roster-eligibility-20261122]
permissions:
  contents: read
jobs:
  reject-retired-and-old-team-players:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy xgboost requests
      - name: Test actual source eligibilities and no stale player forecasts
        run: |
          python -m py_compile nfl_yardage_v2.py nfl_serving_builder_a.py
          python -m unittest discover -s tests -p test_nfl_recent_current_team_role.py -v
          python -m unittest discover -s tests -p test_nfl_universal_opportunity.py -v
      - name: Rebuild real source stats, not current displayed picks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u nfl_player_games_foundation_a.py \
            --season 2022 2023 2024 2025 2026 \
            --db /tmp/nfl_current_roster_integrity.sqlite
      - name: Verify original model refuses all former-team players
        run: |
          python - <<'PY'
          import json,sqlite3
          import nfl_yardage_v2 as v2
          import nfl_current_team_role_guard as guard
          c=sqlite3.connect("file:/tmp/nfl_current_roster_integrity.sqlite?mode=ro",uri=True)
          frozen=v2.Projector(c,2026,11)
          original=[{"market":market,"player_id":"","player":name,
                     "team":team,"projected_mean":float(y)}
                    for (market,name,team),y in frozen.proj.items()]
          selected,audit=guard.filter_current_team_picks(c,original,2026,11)
          print("NFL_RECENT_TEAM_ROLE_SOURCE_AUDIT",json.dumps({
            "frozen_v2_unmodified_raw_candidates":len(original),
            "source_supported_after_guard":len(selected),
            "guard":audit
          },sort_keys=True))
          assert frozen.ok and len(original)>0
          assert audit["no_model_centers_or_probabilities_changed"]
          assert all(x["current_team_role_source"] in
                     ("PRIOR_COMPLETED_TEAM_GAME","UNVERIFIED_SOURCE_IDENTITY")
                     for x in selected)
          assert audit["removed_count"]>10
          assert "aj green" not in [v2.norm_name(p["player"]) for p in selected]
          assert "julio jones" not in [v2.norm_name(p["player"]) for p in selected]
          c.close()
          PY
