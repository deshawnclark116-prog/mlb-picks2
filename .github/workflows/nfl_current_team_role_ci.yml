name: NFL CURRENT TEAM ROLE safety regression
on:
  pull_request:
    paths:
      - nfl_yardage_v2.py
      - tests/test_nfl_recent_current_team_role.py
      - .github/workflows/nfl_current_team_role_ci.yml
  push:
    branches: [fix/nfl-current-team-roster-eligibility-20261122]
permissions:
  contents: read
jobs:
  reject-retired-and-old-team-players:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy xgboost requests
      - name: Test actual source eligibilities and no stale player forecasts
        run: |
          python -m py_compile nfl_yardage_v2.py nfl_serving_builder_a.py
          python -m unittest discover -s tests -p test_nfl_recent_current_team_role.py -v
          python -m unittest discover -s tests -p test_nfl_universal_opportunity.py -v
      - name: Rebuild real source stats, not current displayed picks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u nfl_player_games_foundation_a.py \
            --season 2022 2023 2024 2025 2026 \
            --db /tmp/nfl_current_roster_integrity.sqlite
      - name: Verify original model refuses all former-team players
        run: |
          python - <<'PY'
          import json,sqlite3
          import nfl_yardage_v2 as v2
          c=sqlite3.connect("file:/tmp/nfl_current_roster_integrity.sqlite?mode=ro",uri=True)
          p=v2.Projector(c,2026,11)
          blocked={m:[] for m in v2.MARKETS}
          for (market,name,team),info in p.blocked.items():
              blocked[market].append({"name":name,"team":team,"reason":info["reason"]})
          print("NFL_RECENT_TEAM_ROLE_SOURCE_AUDIT",json.dumps({
            "live_model_projections":len(p.proj),
            "blocked_by_market":{k:len(v) for k,v in blocked.items()},
            "sample_archived_blocks":{k:[x for x in v if x["reason"]=="NO_VERIFIED_RECENT_CURRENT_TEAM_PARTICIPATION"][:10]
                                      for k,v in blocked.items()},
          },sort_keys=True))
          assert p.ok and len(p.proj)>0
          for (market,name,team) in p.proj:
              h=v2.History(c,market)
              _,history,_=h.replay(until=(2026,11))
              ps=[p for p in history.values() if p and v2.norm_name(p[-1]["name"])==name and p[-1]["team"]==team]
              assert len(ps)==1
              assert ps[0][-1]["season"]==2026,("ARCHIVED_PLAYER_PASSED",market,name,team)
          assert p.get("receiving_yards","Tom Brady","TB") is None
          c.close()
          PY
