name: NFL league-injury pregame hard-OUT source verification
on:
  pull_request:
    paths:
      - nfl_game_day_injury_evidence.py
      - nfl_serving_builder_a.py
      - nfl_role_snapshot_batch.py
      - tests/test_nfl_game_day_injury_evidence.py
      - tests/test_nfl_role_snapshot_batch.py
      - .github/workflows/nfl_game_day_injury_evidence.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest requests
      - name: Protect actual original projections from uncertain participation and stale source timestamps
        run: |
          python -m pytest -q tests/test_nfl_game_day_injury_evidence.py tests/test_nfl_role_snapshot_batch.py
          python -m py_compile nfl_serving_builder_a.py nfl_game_day_injury_evidence.py nfl_role_snapshot_batch.py
      - name: Probe real uncredentialed ESPN league injury data after source response
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from collections import Counter
          from nfl_game_day_injury_evidence import capture_league_injuries
          t=datetime.now(timezone.utc)
          data=capture_league_injuries(2026,t)
          counts=Counter(r["status"] for r in data["records"])
          print("NFL_LEAGUE_INJURY_LIVE_SOURCE_PROBE",{
              "status":data["status"],"season_verified":data["season_verified"],
              "source":data["source"],"checked_at_utc":data["checked_at_utc"],
              "records":len(data["records"]),"status_types":dict(counts),
              "reason":data.get("reason"),
              "has_athlete_id":sum(bool(r["espn_athlete_id"]) for r in data["records"]),
              "has_fresh_asof_date":sum(r["fresh_asof"] for r in data["records"]),
          })
          if data["status"]!="CAPTURED" or not data["season_verified"]:
              raise SystemExit("LIVE_ESPN_LEAGUE_INJURY_NOT_VERIFIED")
          # Empty sections are an operational NO-DATA alarm, not
          # confirmation that every NFL player is healthy.
          if not data["records"]:
              print("::warning::NFL league injury endpoint has zero actionable source records; this feed cannot corroborate roster availability today.")
          PY
      - name: Diagnose alternate low-volume keyless injury source without repeated full player-map downloads
        run: |
          python - <<'PY'
          import requests
          from collections import Counter
          urls=[
            "https://api.sleeper.app/v1/players/injuries",
            "https://api.sleeper.app/v1/players/nfl?position=QB&active=true"
          ]
          for url in urls:
              try:
                  r=requests.get(url,timeout=18,headers={"User-Agent":"PropEdge-Source-Verification/1.0","Accept":"application/json"})
                  n=len(r.content)
                  print("ALTERNATE_INJURY_SOURCE_PROBE",{"url":url,"status_code":r.status_code,
                        "body_bytes":n,"content_type":r.headers.get("Content-Type")})
                  if r.ok and n<8_000_000:
                      d=r.json()
                      items=list(d.values()) if isinstance(d,dict) else d if isinstance(d,list) else []
                      first=next((x for x in items if isinstance(x,dict)),{})
                      print("ALTERNATE_INJURY_SOURCE_SHAPE",{"url":url,"records":len(items),
                          "fields":sorted(first.keys())[:60],
                          "injury_designations":dict(Counter(str(x.get("injury_status"))
                                 for x in items if isinstance(x,dict) and x.get("injury_status")))})
              except (requests.RequestException,ValueError,TypeError) as exc:
                  print("ALTERNATE_INJURY_SOURCE_UNAVAILABLE",url,type(exc).__name__)
          PY
