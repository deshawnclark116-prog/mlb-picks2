name: NFL V2 Phase1I target-depth catchability research

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_v2_archival_status.py"
      - "tests/test_nfl_v2_archival_status.py"
      - "nfl_v2_phase1i_*.py"
      - "tests/test_nfl_v2_phase1i_*.py"
      - "nfl_models/nfl_player_outcome_v2/phase1i_*"
      - ".github/workflows/nfl_v2_phase1i_target_depth.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research-only dependencies
        run: pip install numpy==2.3.5 pytest
      - name: Deterministic research tests
        run: |
          python -m pytest -q tests/test_nfl_v2_*.py
          python tests/test_nfl_v2_phase0_audit.py
          python tests/test_nfl_v2_phase0_baselines.py
          python tests/test_nfl_v2_phase1a_direct.py
      - name: Archival integrity gate (frozen source availability; stdlib only, no model code)
        id: archival
        run: python -u nfl_v2_archival_status.py --phase i --data-dir /tmp/archival-i --runtime-out /tmp/phase1i-archival-runtime.json
      - name: Archival status on existing PR (no replacement data)
        if: steps.archival.outputs.status == 'EXPECTED_FROZEN_SOURCE_UNAVAILABLE' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const a=JSON.parse(fs.readFileSync('/tmp/phase1i-archival-runtime.json','utf8'));
            const un=a.unavailable_pins.map(p=>p.local_name+' ('+p.reason+')').join(', ');
            let body='<!-- nfl-phase1i-a -->\n## Phase1I-A depth / QB-receiver catchability\n';
            body+=`Head: \`${context.payload.pull_request.head.sha}\`\n\n**Scientific verdict:** ${a.frozen_verdict} (frozen; unchanged)\n\n**Current archival state:** EXPECTED_FROZEN_SOURCE_UNAVAILABLE\n\n`;
            body+='SCIENTIFIC_RESULT_FROZEN · REPRODUCTION_BLOCKED_EXACT_2026_BYTES_UNAVAILABLE · ARCHIVAL_INTEGRITY_VERIFIED\n\n';
            body+=`Verified ${a.available_pins_verified.length} still-available frozen 2023-2025 pins and every frozen scientific artifact byte for byte. Exact pinned 2026 bytes unavailable: ${un}.\n\n`;
            body+='No replacement data were used. No model, selection or confirmation was rerun. This is not a scientific reproduction.\n';
            const params={...context.repo,issue_number:context.issue.number};
            const comments=await github.paginate(github.rest.issues.listComments,params);
            const previous=comments.find(c=>c.user.type==='Bot'&&c.body?.includes('<!-- nfl-phase1i-a -->'));
            if(previous)await github.rest.issues.updateComment({...context.repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({...params,body});
      - name: Source feasibility audit before fitting
        if: steps.archival.outputs.status == 'ALL_AVAILABLE'
        run: |
          python -u nfl_v2_phase1h_sources.py --fetch --data-dir /tmp/phase1i-data --out /tmp/fetched-coverage.json
          python -u nfl_v2_phase1i_sources.py --data-dir /tmp/phase1i-data --out /tmp/phase1i-audit.json
          cmp nfl_models/nfl_player_outcome_v2/phase1i_source_audit.json /tmp/phase1i-audit.json
      - name: Reproduce committed 2024 selection without validation access
        if: steps.archival.outputs.status == 'ALL_AVAILABLE'
        run: |
          python -u nfl_v2_phase1i_target_depth.py --data-dir /tmp/phase1i-data --stage develop --audit /tmp/phase1i-audit.json --lock /tmp/phase1i-reproduced-lock.json
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          saved=json.loads(Path('nfl_models/nfl_player_outcome_v2/phase1i_development_lock.json').read_text())
          reproduced=json.loads(Path('/tmp/phase1i-reproduced-lock.json').read_text())
          def check(a,b):
              if isinstance(a,dict):
                  assert a.keys()==b.keys()
                  for k in a: check(a[k],b[k])
              elif isinstance(a,list):
                  assert len(a)==len(b)
                  for x,y in zip(a,b): check(x,y)
              elif isinstance(a,float):
                  assert np.isclose(a,b,rtol=1e-12,atol=1e-12), 'Frozen research drift: do not rescue or retune'
              else: assert a==b
          check(saved,reproduced)
          PY
      - name: Evaluate frozen specifications only
        if: steps.archival.outputs.status == 'ALL_AVAILABLE'
        run: |
          python -u nfl_v2_phase1i_target_depth.py --data-dir /tmp/phase1i-data --stage confirm --audit /tmp/phase1i-audit.json --out /tmp/phase1i-results.json --receipts /tmp/phase1i-receipts.jsonl.gz
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          saved=json.loads(Path('nfl_models/nfl_player_outcome_v2/phase1i_target_depth_results.json').read_text())
          actual=json.loads(Path('/tmp/phase1i-results.json').read_text())
          def check(a,b):
              if isinstance(a,dict):
                  assert a.keys()==b.keys()
                  for k in a: check(a[k],b[k])
              elif isinstance(a,list):
                  assert len(a)==len(b)
                  for x,y in zip(a,b): check(x,y)
              elif isinstance(a,float): assert np.isclose(a,b,rtol=1e-12,atol=1e-12)
              else: assert a==b
          check(saved,actual)
          PY
      - name: Compact research result on existing PR
        if: steps.archival.outputs.status == 'ALL_AVAILABLE' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const r=JSON.parse(fs.readFileSync('/tmp/phase1i-results.json','utf8'));
            const f=x=>x==null?'NA':x.toFixed(3);
            let body='<!-- nfl-phase1i-a -->\n## Phase1I-A depth / QB-receiver catchability\n';
            body+=`Head: \`${context.payload.pull_request.head.sha}\`\n\n**${r.verdict}**; selected: ${r.selected||'none'}.\n\n`;
            body+='2024 W1–8 fit / W9–18 select; committed lock before 2025. 2026 W1–4 burned diagnostic only. No Week 5+, sportsbook inputs, Monte Carlo, or rescue tuning.\n\n';
            body+='| Fixed architecture | 2025 air YPT MAE | 2025 oracle yards MAE | 2026 air YPT MAE | 2026 oracle yards MAE |\n|---|---:|---:|---:|---:|\n';
            for(const [name,m] of Object.entries(r.periods.validation_2025.metrics)) {
              const d=r.periods.diagnostic_2026_wk1_4.metrics[name];
              body+=`| ${name} | ${f(m.completed_air_per_target_mae)} | ${f(m.oracle_target_rec_yds_mae)} | ${f(d.completed_air_per_target_mae)} | ${f(d.oracle_target_rec_yds_mae)} |\n`;
            }
            body+='\nComponent decisions: '+Object.entries(r.family_decisions).map(([k,v])=>`${k}: **${v}**`).join('; ')+'.\n';
            body+='YAC per target copied unchanged from frozen Phase1G. Full workload: '+r.full_projection_evaluation.status+'.\n';
            body+='PBP depth/IDs/completion available. Complete routes-run, alignment, route-level separation and defender assignment BLOCKED_DATA; current 2026 pressure/coverage unavailable. Prior-week QB roster identities only; no actual starter oracle. Research only.\n';
            const params={...context.repo,issue_number:context.issue.number};
            const comments=await github.paginate(github.rest.issues.listComments,params);
            const previous=comments.find(c=>c.user.type==='Bot'&&c.body?.includes('<!-- nfl-phase1i-a -->'));
            if(previous)await github.rest.issues.updateComment({...context.repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({...params,body});
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v2-phase1i-target-depth
          path: |
            /tmp/phase1i-audit.json
            /tmp/phase1i-archival-runtime.json
            /tmp/phase1i-reproduced-lock.json
            /tmp/phase1i-results.json
            /tmp/phase1i-receipts.jsonl.gz
          if-no-files-found: warn
