name: NFL research data source probe
on:
  push:
    branches: [claude/system-review-jxc001]
    paths:
      - research/nfl_model_tests/probe_sources.py
      - .github/workflows/nfl-feature-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect NFLverse charting and injury sources
        run: python -u research/nfl_model_tests/probe_sources.py
