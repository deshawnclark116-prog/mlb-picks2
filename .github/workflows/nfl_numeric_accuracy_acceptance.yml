name: NFL numeric projection accuracy independent audit
on:
  push:
    branches: [feat/nfl-asof-numerical-accuracy-report]
    paths:
      - nfl_numeric_accuracy_audit.py
      - tests/test_nfl_numeric_accuracy_audit.py
      - .github/workflows/nfl_numeric_accuracy_acceptance.yml
  pull_request:
    paths:
      - nfl_numeric_accuracy_audit.py
      - tests/test_nfl_numeric_accuracy_audit.py
      - .github/workflows/nfl_numeric_accuracy_acceptance.yml
  # Independently measure completed NFL games after Monday football and the
  # nflverse source update. Never use a sportsbook line as a stat projection.
  schedule:
    - cron: "21 11 * * 3"
  workflow_dispatch: {}
concurrency:
  group: nfl-numeric-accuracy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  numerical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Guard temporal accuracy and last-3 comparison
        run: python -m pytest -q tests/test_nfl_numeric_accuracy_audit.py
      - name: Fetch exact real NFL 2025/26 results into a temporary database
        run: |
          python -u nfl_player_games_foundation_a.py --season 2025 2026 --db "$RUNNER_TEMP/nfl-accuracy-real.sqlite"
      - name: Grade first-seen genuine numerical forecasts versus official player outcomes
        run: |
          python -u nfl_numeric_accuracy_audit.py --db "$RUNNER_TEMP/nfl-accuracy-real.sqlite" --ledger docs/nfl_picks_log.jsonl --through-week 4 --out "$RUNNER_TEMP/nfl-numerical-week1to4-audit.json"
          python - "$RUNNER_TEMP/nfl-numerical-week1to4-audit.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1]))
          assert doc['first_seen_pregame_only'] and not doc['automatic_promotion']
          assert doc['eligible_sample'] >= 1, 'No genuine pregame model medians matched final outcomes: FAIL CLOSED'
          assert doc['overall']['mae'] >= 0
          print('REAL_NUMERIC_ACCURACY',json.dumps(doc['overall'],sort_keys=True))
          print('REAL_PER_MARKET',json.dumps(doc['by_market'],sort_keys=True))
          PY
      - name: Preserve full audit with every eligible pregame forecast and exclusion reason
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-real-numeric-mae-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-numerical-week1to4-audit.json
          if-no-files-found: warn
          retention-days: 60
      - name: Grade completed games and publish the unpromoted numerical scorecard
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python -u nfl_numeric_accuracy_audit.py --db "$RUNNER_TEMP/nfl-accuracy-real.sqlite" --ledger docs/nfl_picks_log.jsonl --out docs/nfl_numeric_accuracy_audit.json
          python - <<'PY'
          import json
          d=json.load(open('docs/nfl_numeric_accuracy_audit.json'))
          assert d['first_seen_pregame_only'] is True and d['automatic_promotion'] is False
          assert d['eligible_sample']>=1 and len(d['forecasts'])==d['eligible_sample']
          print('PUBLISH_GRADED_ONLY',d['overall'])
          PY
          git config user.name 'nfl-numerical-audit[bot]'
          git config user.email 'nfl-numerical-audit[bot]@users.noreply.github.com'
          git add docs/nfl_numeric_accuracy_audit.json
          git diff --cached --quiet && { echo 'no updated accuracy report'; exit 0; }
          git commit -m "NFL real first-seen forecast error audit $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase --autostash origin/main
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish numerical audit"; exit 1
