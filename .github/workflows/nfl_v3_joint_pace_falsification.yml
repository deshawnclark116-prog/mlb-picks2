name: NFL V3 empirically falsify joint game-pace hypothesis
on:
  pull_request:
    paths:
      - nfl_v3_joint_pace_falsification.py
      - tests/test_nfl_v3_joint_pace_falsification.py
      - .github/workflows/nfl_v3_joint_pace_falsification.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  raw-game-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source and no-hindsight regression contracts
        run: |
          python -m pip install pytest requests
          python -m pytest -q tests/test_nfl_v3_joint_pace_falsification.py
          python -m py_compile nfl_v3_joint_pace_falsification.py
      - name: Build original completed NFL team-game opportunity proxies
        run: |
          python -u nfl_player_games_foundation_a.py \
            --season 2024 2025 2026 \
            --db /tmp/nfl_joint_pace_real_games.sqlite
      - name: Test paired residual game pace 2024 vs 2025 and hold out 2026
        run: |
          set -euo pipefail
          python -u nfl_v3_joint_pace_falsification.py \
            --db /tmp/nfl_joint_pace_real_games.sqlite \
            --asof 2026-11-07T23:00:00Z \
            --out /tmp/nfl_v3_joint_pace_falsification.json
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-v3-joint-game-pace-falsification
          path: /tmp/nfl_v3_joint_pace_falsification.json
          retention-days: 90
