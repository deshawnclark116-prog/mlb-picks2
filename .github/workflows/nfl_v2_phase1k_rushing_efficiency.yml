name: NFL V2 Phase1K PBP-only rushing efficiency research

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_v2_phase1k_*.py"
      - "tests/test_nfl_v2_phase1k_*.py"
      - "nfl_models/nfl_player_outcome_v2/phase1k_*"
      - ".github/workflows/nfl_v2_phase1k_rushing_efficiency.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: pip install numpy==2.3.5 pytest
      - name: Deterministic tests and protected-history checks
        run: |
          python -m pytest -q tests/test_nfl_v2_*.py
          python tests/test_nfl_v2_phase0_audit.py
          python tests/test_nfl_v2_phase0_baselines.py
          python tests/test_nfl_v2_phase1a_direct.py
      - name: Frozen PBP-only source audit before fitting
        run: |
          python -u nfl_v2_phase1k_sources.py --fetch --data-dir /tmp/phase1k-data --out /tmp/phase1k-audit.json
          cmp nfl_models/nfl_player_outcome_v2/phase1k_pbp_source_audit.json /tmp/phase1k-audit.json
      - name: Reproduce 2024-only development lock
        run: |
          python -u nfl_v2_phase1k_rushing_efficiency.py --data-dir /tmp/phase1k-data --stage develop --audit /tmp/phase1k-audit.json --lock /tmp/phase1k-lock.json
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          def check(a,b):
              if isinstance(a,dict):
                  assert a.keys()==b.keys()
                  for k in a:check(a[k],b[k])
              elif isinstance(a,list):
                  assert len(a)==len(b)
                  for x,y in zip(a,b):check(x,y)
              elif isinstance(a,float):assert np.isclose(a,b,rtol=1e-12,atol=1e-12), 'Frozen lock drift: do not retune'
              else:assert a==b
          check(json.loads(Path('nfl_models/nfl_player_outcome_v2/phase1k_development_lock.json').read_text()),json.loads(Path('/tmp/phase1k-lock.json').read_text()))
          PY
      - name: Frozen confirmation or preregistered development stop
        run: |
          python -u nfl_v2_phase1k_rushing_efficiency.py --data-dir /tmp/phase1k-data --stage confirm --out /tmp/phase1k-results.json --receipts /tmp/phase1k-receipts.jsonl.gz
          cmp nfl_models/nfl_player_outcome_v2/phase1k_rushing_results.json /tmp/phase1k-results.json
          cmp nfl_models/nfl_player_outcome_v2/phase1k_rushing_receipts.jsonl.gz /tmp/phase1k-receipts.jsonl.gz
      - name: Compact result on existing PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const r=JSON.parse(fs.readFileSync('/tmp/phase1k-results.json','utf8'));
            const lock=JSON.parse(fs.readFileSync('/tmp/phase1k-lock.json','utf8'));
            const f=x=>x==null?'NA':x.toFixed(3);
            let body='<!-- nfl-phase1k-r -->\n## Phase1K-R PBP-only rushing efficiency\n';
            body+=`Head: \`${context.payload.pull_request.head.sha}\`\n\n**${r.verdict}**; selected: ${r.selected||'none'}.\n\n`;
            body+='Actual carries × pregame YPC first. 2024 W1–8 fit / W9–18 select; development lock precedes confirmation. No Week 5+, sportsbooks, FTN, OL, personnel inputs, Monte Carlo or rescue tuning. Receiving remains frozen.\n\n';
            body+='| Family | 2024 oracle-carry MAE | YPC MAE | Decision |\n|---|---:|---:|---|\n';
            for(const [name,x] of Object.entries(lock.families))body+=`| ${name} | ${f(x.metrics?.oracle_carry_mae)} | ${f(x.metrics?.ypc_mae)} | ${x.status} |\n`;
            for(const label of ['validation_2025','diagnostic_2026_wk1_4']) {
              const p=r.periods[label];
              body+=`\n${label}: ${p.status||('oracle-carry MAE '+f(p.metrics.oracle_carry_mae)+', YPC MAE '+f(p.metrics.ypc_mae))}.\n`;
            }
            body+='\nFull projection: '+r.full_projection_evaluation.status+'. Postgame oracle diagnostics are descriptive only. Historical PBP files are corrected retrospective snapshots, not archived original cutoff vintages.\n';
            const params={...context.repo,issue_number:context.issue.number};
            const comments=await github.paginate(github.rest.issues.listComments,params);
            const old=comments.find(c=>c.user.type==='Bot'&&c.body?.includes('<!-- nfl-phase1k-r -->'));
            if(old)await github.rest.issues.updateComment({...context.repo,comment_id:old.id,body});
            else await github.rest.issues.createComment({...params,body});
      - name: Upload audit, lock, results and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v2-phase1k-rushing-efficiency
          path: |
            /tmp/phase1k-audit.json
            /tmp/phase1k-lock.json
            /tmp/phase1k-results.json
            /tmp/phase1k-receipts.jsonl.gz
          if-no-files-found: warn
