name: NFL one-time immediate updated-model run 2026-11-22
on:
  push:
    paths:
      - ".github/workflows/nfl_run_now_20261122.yml"
  pull_request:
    paths:
      - ".github/workflows/nfl_run_now_20261122.yml"
  workflow_dispatch: {}

concurrency:
  group: nfl-production-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  rebuild-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen production dependencies
        run: python -m pip install requests numpy xgboost
      - name: Execute latest model, freeze original probabilities, grade prior numerical forecasts
        env:
          THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NFL_DATA_DIR: /tmp/nfl_data
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "NFL_MODEL_SOURCE_COMMIT $(git rev-parse HEAD)"
          python -u nfl_player_games_foundation_a.py --season 2025 2026 --db nfl_models/nfl_model.sqlite
          python -u nfl_pbp_foundation_a.py --seasons 2025 2026 --db nfl_models/nfl_carry_log.sqlite
          python - <<'PY'
          import sqlite3,subprocess,sys
          db="nfl_models/nfl_model.sqlite"
          with sqlite3.connect("file:"+db+"?mode=ro",uri=True) as con:
              seasons={r[0] for r in con.execute("SELECT DISTINCT season FROM player_games")}
          needed={2022,2023,2024,2025}
          if needed<=seasons:
              sys.exit(subprocess.call(["python","-u","nfl_serving_builder_a.py","--selftest"]))
          print("VALIDATION_SEASONS_MISSING",sorted(needed-seasons))
          PY
          python -u nfl_serving_builder_a.py
          python -u nfl_role_snapshot_batch.py --forecast docs/nfl_predictions.json --db nfl_models/nfl_model.sqlite --out docs/nfl_role_snapshot.json
          python -u nfl_game_day_contract.py --file docs/nfl_predictions.json --db nfl_models/nfl_model.sqlite
          python -u nfl_grade_record_a.py
          python -u nfl_numeric_forward_grade.py --db nfl_models/nfl_model.sqlite --log docs/nfl_picks_log.jsonl --out docs/nfl_numeric_forward_grade.json
          python - <<'PY'
          import json
          p=json.load(open("docs/nfl_predictions.json"))
          w=[{"market":r["market"],"source":r.get("model_source"),"projected_median":r.get("projected_median"),"projected_mean":r.get("projected_mean"),"opponent":r.get("opponent")} for r in p.get("picks",[]) if "xavier worthy" in r.get("player","").lower()]
          print("NFL_RUN_NOW_VERIFIED",json.dumps({"generated_at_utc":p.get("generated_at_utc"),"season":p.get("season"),"week":p.get("week"),"n_picks":len(p.get("picks",[])),"worthy_receiving_yards":[r for r in w if r["market"]=="receiving_yards"],"worthy_other_markets":[r for r in w if r["market"]!="receiving_yards"]}))
          PY
      - name: Commit only fully validated, strictly pregame NFL forecast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/nfl_predictions.json docs/nfl_predictions_20??_w??.json docs/nfl_picks_log.jsonl docs/nfl_record.json docs/nfl_role_snapshot.json docs/nfl_numeric_forward_grade.json
          if git diff --cached --quiet; then
            echo "NFL_RUN_NOW_NO_CHANGED_FORECAST"
            exit 0
          fi
          git commit -m "NFL run now: verified live model $(date -u +%FT%TZ)"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "NFL_RUN_NOW_PUBLISHED"
              exit 0
            fi
            git fetch origin main
            git rebase --autostash origin/main
            sleep $((n * 3))
          done
          echo "::error::NFL_RUN_NOW_PUBLISH_FAILED"
          exit 1
