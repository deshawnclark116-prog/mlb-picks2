name: NFL V2 Phase1H routed receiving research

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_v2_archival_status.py"
      - "tests/test_nfl_v2_archival_status.py"
      - "nfl_v2_phase1h_*.py"
      - "tests/test_nfl_v2_phase1h_*.py"
      - "nfl_models/nfl_player_outcome_v2/phase1h_*"
      - ".github/workflows/nfl_v2_phase1h_routed_receiving.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research-only dependencies
        run: pip install numpy==2.3.5 pytest
      - name: Deterministic research tests
        run: |
          python -m pytest -q tests/test_nfl_v2_*.py
          python tests/test_nfl_v2_phase0_audit.py
          python tests/test_nfl_v2_phase0_baselines.py
          python tests/test_nfl_v2_phase1a_direct.py
      - name: Archival integrity gate (frozen source availability; stdlib only, no model code)
        id: archival
        run: python -u nfl_v2_archival_status.py --phase h --data-dir /tmp/archival-h --runtime-out /tmp/phase1h-archival-runtime.json
      - name: Archival status on existing PR (no replacement data)
        if: steps.archival.outputs.status == 'EXPECTED_FROZEN_SOURCE_UNAVAILABLE' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const a=JSON.parse(fs.readFileSync('/tmp/phase1h-archival-runtime.json','utf8'));
            const un=a.unavailable_pins.map(p=>p.local_name+' ('+p.reason+')').join(', ');
            let body='<!-- nfl-phase1h-r -->\n## Phase1H-R routed receiving\n';
            body+=`Head: \`${context.payload.pull_request.head.sha}\`\n\n**Scientific verdict:** ${a.frozen_verdict} (frozen; unchanged)\n\n**Current archival state:** EXPECTED_FROZEN_SOURCE_UNAVAILABLE\n\n`;
            body+='SCIENTIFIC_RESULT_FROZEN · REPRODUCTION_BLOCKED_EXACT_2026_BYTES_UNAVAILABLE · ARCHIVAL_INTEGRITY_VERIFIED\n\n';
            body+=`Verified ${a.available_pins_verified.length} still-available frozen 2023-2025 pins and every frozen scientific artifact byte for byte. Exact pinned 2026 bytes unavailable: ${un}.\n\n`;
            body+='No replacement data were used. No model, selection or confirmation was rerun. This is not a scientific reproduction.\n';
            const params={...context.repo,issue_number:context.issue.number};
            const comments=await github.paginate(github.rest.issues.listComments,params);
            const previous=comments.find(c=>c.user.type==='Bot'&&c.body?.includes('<!-- nfl-phase1h-r -->'));
            if(previous)await github.rest.issues.updateComment({...context.repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({...params,body});
      - name: Audit sources before fitting
        if: steps.archival.outputs.status == 'ALL_AVAILABLE'
        run: |
          python -u nfl_v2_phase1h_sources.py --fetch --data-dir /tmp/phase1h-data --out /tmp/phase1h-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          saved=json.loads(Path('nfl_models/nfl_player_outcome_v2/phase1h_source_coverage.json').read_text())
          fresh=json.loads(Path('/tmp/phase1h-coverage.json').read_text())
          for year, sources in saved['seasons'].items():
              for source, m in sources.items():
                  assert m.get('sha256') == fresh['seasons'][year][source].get('sha256'), f'Frozen source changed: {year}/{source}; do not retune or silently rerun on a revised corpus'
          PY
      - name: Reproduce locked 2024 development and verify selection
        if: steps.archival.outputs.status == 'ALL_AVAILABLE'
        run: |
          python -u nfl_v2_phase1h_routed_receiving.py --data-dir /tmp/phase1h-data --stage develop --lock /tmp/phase1h-lock.json
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          saved=json.loads(Path('nfl_models/nfl_player_outcome_v2/phase1h_development_lock.json').read_text())
          reproduced=json.loads(Path('/tmp/phase1h-lock.json').read_text())
          assert saved['selected'] == reproduced['selected']
          def check(a, b):
              if isinstance(a, dict):
                  assert a.keys() == b.keys()
                  for k in a: check(a[k], b[k])
              elif isinstance(a, list):
                  assert len(a) == len(b)
                  for x,y in zip(a,b): check(x,y)
              elif isinstance(a, float):
                  assert np.isclose(a,b,rtol=1e-12,atol=1e-12), 'Refit coefficient changed beyond numerical tolerance; no rescue permitted'
              else:
                  assert a == b
          check(saved['frozen_refit_specs'], reproduced['frozen_refit_specs'])
          PY
      - name: Evaluate frozen validation and burned diagnostics
        if: steps.archival.outputs.status == 'ALL_AVAILABLE'
        run: |
          python -u nfl_v2_phase1h_routed_receiving.py --data-dir /tmp/phase1h-data --stage confirm --out /tmp/phase1h-results.json --receipts /tmp/phase1h-receipts.jsonl.gz
      - name: Compact research result on existing PR
        if: steps.archival.outputs.status == 'ALL_AVAILABLE' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('/tmp/phase1h-results.json', 'utf8'));
            const f = x => x == null ? '—' : x.toFixed(3);
            let body = '<!-- nfl-phase1h-r -->\n## Phase1H-R routed receiving\n';
            body += `Head: \`${context.payload.pull_request.head.sha}\`\n\n**${r.verdict}**; selected: ${r.selected || 'none'}.\n\n`;
            body += '2024 W1–8 fit / W9–18 select; frozen before 2025. 2026 W1–4 burned only. No sportsbook inputs / Monte Carlo.\n\n';
            body += '| Architecture | 2025 oracle-yard MAE | 2025 YPT MAE | 2026 oracle-yard MAE | 2026 YPT MAE |\n|---|---:|---:|---:|---:|\n';
            for (const [name, m] of Object.entries(r.periods.validation_2025.metrics)) {
              const d = r.periods.diagnostic_2026_wk1_4.metrics[name];
              body += `| ${name} | ${f(m.oracle_target_rec_yds_mae)} | ${f(m.yards_per_target_mae)} | ${f(d.oracle_target_rec_yds_mae)} | ${f(d.yards_per_target_mae)} |\n`;
            }
            body += '\nFull projections: ' + r.full_projection_evaluation.status + '.\n';
            body += '2026 man/zone and true pressure unavailable; older history explicitly stale. Defensive absences blocked by timing. Research only; no production promotion.\n';
            const params = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(c => c.user.type === 'Bot' && c.body?.includes('<!-- nfl-phase1h-r -->'));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...params, body });
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v2-phase1h-routed-receiving
          path: |
            /tmp/phase1h-coverage.json
            /tmp/phase1h-archival-runtime.json
            /tmp/phase1h-lock.json
            /tmp/phase1h-results.json
            /tmp/phase1h-receipts.jsonl.gz
          if-no-files-found: warn
