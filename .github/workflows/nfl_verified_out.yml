name: NFL verified Out zero-participation integrity
on:
  pull_request:
    paths:
      - nfl_phase1_forecast.py
      - tests/test_nfl_verified_out_no_opportunities.py
      - .github/workflows/nfl_verified_out.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verified-inactive:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source and simulation testing dependencies
        run: python -m pip install numpy scipy pandas pytest
      - name: Run hard-zero injury and event allocation regression
        run: |
          python -m pytest -q tests/test_nfl_verified_out_no_opportunities.py
          python -m pytest -q tests/test_nfl_phase1c_invariants.py tests/test_nfl_phase1_invariants.py
      - name: Confirm deterministic model identity reflects modified code
        run: |
          python - <<'PY'
          import hashlib
          from nfl_phase1_forecast import CODE_FILES,file_hashes
          hashes=file_hashes()
          assert "nfl_phase1_forecast.py" in CODE_FILES
          assert hashes["nfl_phase1_forecast.py"]==hashlib.sha256(open("nfl_phase1_forecast.py","rb").read()).hexdigest()
          print("NFL_VERIFIED_OUT_MODEL_IDENTITY_GUARDED")
          PY
