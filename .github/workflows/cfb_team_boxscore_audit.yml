name: CFB Team Boxscore Research Audit
on:
  pull_request:
    paths:
      - 'cfb_team_boxscore_audit.py'
      - 'tests/test_cfb_team_boxscore_audit.py'
      - '.github/workflows/cfb_team_boxscore_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_cfb_team_boxscore_audit.py
      - run: python -u cfb_team_boxscore_audit.py --season 2026 --week 11 --out team-audit.json
      - name: Summarize reconciliation
        run: |
          python - <<'PY'
          import json, collections
          j=json.load(open('team-audit.json'))
          counts=collections.Counter(r['status'] for g in j['games'] for r in g['rows'])
          print(counts)
          print('Missing source games:',sum(g['source_missing'] for g in j['games']))
          assert counts['match'] + counts['mismatch'] > 0, 'No reconciled data'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-team-audit
          path: team-audit.json
