name: NFL opportunity-first shadow actual-outcomes validation
on:
  push:
    branches:
      - research/nfl-usage-v01
    paths:
      - nfl_opportunity_shadow.py
      - tests/test_nfl_opportunity_shadow.py
      - .github/workflows/nfl_opportunity_shadow_eval.yml
      - docs/research/nfl_opportunity_shadow_v01.md
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fixed-protocol-2025-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock candidate assumptions and test strict chronological role logic
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_nfl_opportunity_shadow.py
          python -m py_compile nfl_opportunity_shadow.py
      - name: Acquire independent raw nflverse boxscore and game schedule only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u nfl_player_games_foundation_a.py \
            --season 2024 2025 2026 \
            --db /tmp/nfl_role_shadow.sqlite
      - name: Evaluate frozen opportunity model on 2025 and consulted 2026
        run: |
          python -u nfl_opportunity_shadow.py \
            --db /tmp/nfl_role_shadow.sqlite \
            --out /tmp/nfl_opportunity_shadow_report.json
          python - <<'PY'
          import json
          doc=json.load(open('/tmp/nfl_opportunity_shadow_report.json'))
          assert doc['promotion_status']=='RESEARCH_ONLY_NOT_ELIGIBLE_FOR_PRODUCTION'
          assert doc['uses_target_week_data_in_features'] is False
          assert all(doc['cohorts'][f'{s}_{market}']['n']>0
                     for s in (2025,2026) for market in ('rushing_yards','receiving_yards'))
          print('Result is research-only. No automated production promotion.')
          PY
      - name: Preserve reproducible forward-research measurements
        uses: actions/upload-artifact@v4
        with:
          name: nfl-opportunity-first-v01-holdout-measurements
          path: /tmp/nfl_opportunity_shadow_report.json
          retention-days: 90
