name: NFL new engine publish (read-only presentation)

# Presentation only. After a SUCCESSFUL "NFL Phase 1E shadow" run this job reads the nfl-shadow-state branch (checked out WITHOUT push credentials), runs the deterministic
# read-only publisher and commits docs/nfl_phase1_shadow.json to main. It never writes to nfl-shadow-state, never imports the forecast store / scheduler / simulator,
# and never touches docs/nfl_predictions.json or any production serving file.
on:
  workflow_run:
    workflows: ["NFL Phase 1E shadow (durable dispatch)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: nfl-new-engine-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          ref: nfl-shadow-state
          path: state
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install numpy

      - name: Publish docs/nfl_phase1_shadow.json (read-only on the state branch)
        run: python nfl_phase1_publisher.py --state state --out docs/nfl_phase1_shadow.json --odds docs/nfl_odds_cache.json

      - name: Commit the presentation file only
        run: |
          git config user.name "nfl-new-engine-publisher"; git config user.email "nfl-new-engine-publisher@users.noreply.github.com"
          git add docs/nfl_phase1_shadow.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "NFL new engine: publish shadow forecasts view $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || true
            sleep $((i*3))
          done
          echo "::error::push to main failed"; exit 1
