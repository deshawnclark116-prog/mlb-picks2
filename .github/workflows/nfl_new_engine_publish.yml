name: NFL new engine publish (read-only presentation)

# Presentation only. After a completed "NFL Phase 1E shadow" run this job reads the nfl-shadow-state branch (checked out WITHOUT push credentials), runs the deterministic
# read-only publisher and commits docs/nfl_phase1_shadow.json to main. It never writes to nfl-shadow-state, never imports the forecast store / scheduler / simulator,
# and never touches docs/nfl_predictions.json or any production serving file.
on:
  workflow_run:
    workflows: ["NFL Phase 1E shadow (durable dispatch)"]
    types: [completed]
  schedule:
    - cron: "6,21,36,51 * * * *"      # independent fallback (off-round): the publisher is read-only on nfl-shadow-state, so repeated runs are safe and unchanged output commits nothing
  workflow_dispatch:

concurrency:
  group: nfl-new-engine-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'refs/heads/main' }}
          path: code

      - uses: actions/checkout@v4
        with:
          ref: main
          path: output

      - uses: actions/checkout@v4
        with:
          ref: nfl-shadow-state
          path: state
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install numpy

      - name: Publish docs/nfl_phase1_shadow.json (read-only on the state branch)
        id: publish
        continue-on-error: true
        run: python code/nfl_phase1_publisher.py --state state --out output/docs/nfl_phase1_shadow.json --odds output/docs/nfl_odds_cache.json --fail-on-operational-empty

      - name: Commit the presentation file only
        working-directory: output
        run: |
          git config user.name "nfl-new-engine-publisher"; git config user.email "nfl-new-engine-publisher@users.noreply.github.com"
          git add docs/nfl_phase1_shadow.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "NFL new engine: publish shadow forecasts view $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((i*3))
          done
          echo "::error::push to main failed"; exit 1

      - name: Verify actual receipt-to-publication parity
        if: always()
        run: |
          python code/nfl_shadow_delivery_audit.py \
            --state state --published output/docs/nfl_phase1_shadow.json \
            --fail-recent-hours 6 \
            --out "$RUNNER_TEMP/nfl-shadow-delivery-audit.json"

      - name: Preserve delivery audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-shadow-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-shadow-delivery-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail visibly after committing the honest empty diagnostic
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::PUBLISH_EMPTY or publisher verification failed; no forecast success claimed"
          exit 1
