name: NFL V7 pretip roster-returner joint research (not production)
on:
  pull_request:
    paths:
      - nfl_v7_roster_returner.py
      - nfl_v7_original_forward_grade.py
      - tests/test_nfl_v7_original_forward_grade.py
      - tests/test_nfl_v7_roster_returner.py
      - .github/workflows/nfl_v7_roster_returner.yml
  push:
    paths:
      - nfl_v7_roster_returner.py
      - nfl_v7_original_forward_grade.py
      - tests/test_nfl_v7_original_forward_grade.py
      - tests/test_nfl_v7_roster_returner.py
      - .github/workflows/nfl_v7_roster_returner.yml
  workflow_dispatch:
  schedule:
    - cron: '10 12,16,20,23 * 9-12 0,1,3,4,5,6'
permissions:
  contents: write
concurrency:
  group: nfl-v7-firstseen-roster-returner
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mathematical runtime
        run: pip install numpy requests
      - name: Regression and source-isolation checks
        run: |
          python -m unittest discover -s tests -p 'test_nfl_v7_roster_returner.py' -v
          python -m unittest discover -s tests -p 'test_nfl_v7_original_forward_grade.py' -v
  capture:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data and simulation runtime
        run: pip install numpy requests
      - name: Test roster/source contracts before publishing
        run: |
          python -m unittest discover -s tests -p 'test_nfl_v7_roster_returner.py' -v
          python -m unittest discover -s tests -p 'test_nfl_v7_original_forward_grade.py' -v
      - name: Check scheduled 30-hour game window
        id: window
        run: |
          python - <<'PY'
          import datetime,os,sqlite3
          now=datetime.datetime.now(datetime.timezone.utc)
          db=sqlite3.connect('nfl_models/nfl_model.sqlite')
          games=[]
          for gid,t in db.execute('SELECT game_id,kickoff_utc FROM games WHERE kickoff_utc IS NOT NULL'):
              kick=datetime.datetime.fromisoformat(str(t).replace('Z','+00:00'))
              if 0<(kick-now).total_seconds()<=30*3600:
                  games.append(gid)
          with open(os.environ['GITHUB_OUTPUT'],'a') as fp:
              fp.write('run='+('true' if games else 'false')+'\n')
          print('NFL_V7_REAL_PREGAME_WINDOW',games)
          PY
      - name: Rebuild factual pregame nflverse foundation
        if: steps.window.outputs.run == 'true'
        env:
          GITHUB_TOKEN: \${{ github.token }}
        run: python -u nfl_player_games_foundation_a.py --season 2025 2026 --db nfl_models/nfl_model.sqlite
      - name: Download actual 2025/2026 PFR snap source bytes
        if: steps.window.outputs.run == 'true'
        run: |
          set -euo pipefail
          for year in 2025 2026; do
            curl --fail --location --silent --show-error --retry 4 \
              "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_$year.csv" \
              -o "/tmp/nfl_snap_counts_$year.csv"
            test -s "/tmp/nfl_snap_counts_$year.csv"
          done
      - name: Freeze V7 original player predictions with actual roster receipts
        if: steps.window.outputs.run == 'true'
        run: |
          python -u nfl_v7_roster_returner.py \
            --db nfl_models/nfl_model.sqlite \
            --snap-files /tmp/nfl_snap_counts_2025.csv /tmp/nfl_snap_counts_2026.csv \
            --out-dir docs/nfl_v7_firstseen --simulations 20000
      - name: Publish immutable research-only observations
        if: steps.window.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -d docs/nfl_v7_firstseen ] || ! find docs/nfl_v7_firstseen -name '2026_*.json' -print -quit | grep -q .; then
            echo 'NFL_V7_NO_VALID_PREGAME_ROSTER_FORECAST'
            exit 0
          fi
          git add -- docs/nfl_v7_firstseen
          if git diff --cached --quiet; then
            echo 'NFL_V7_NO_COMPLETE_NEW_PREGAME_ROSTER_CAPTURE'
            exit 0
          fi
          git commit -m 'Freeze authentic pretip NFL V7 roster-conditioned research forecasts'
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo NFL_V7_FIRSTSEEN_PUBLISHED
              exit 0
            fi
            git fetch origin main
            git rebase --autostash origin/main
            sleep $((i*2))
          done
          exit 1
