name: NHL V2 Phase1A-SOG forward run (manual)

# Research only. workflow_dispatch only: scheduled workflows would fire only from the default branch, and this branch must not be merged.
# A forecast is valid only inside its horizon window; a manual run outside a window records MISSED_CUTOFF and never backfills.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "forecast | grade | verify"
        required: true
        default: "verify"

permissions:
  contents: write

concurrency:
  group: nhl-v2-sog-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-research-nhl.txt
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$GITHUB_REF_NAME" in
            codex/nhl-outcome-engine-v2|codex/nhl-v2-forward-integrity-repair) ;;
            *) echo "Refusing ledger write outside approved NHL research branches"; exit 1 ;;
          esac
          case "$MODE" in forecast|grade|verify) ;; *) exit 1 ;; esac
          python nhl_v2_phase1a_sog_forward.py verify
          if [ "$MODE" = "forecast" ]; then python nhl_v2_phase1a_sog_forward.py run; fi
          if [ "$MODE" = "grade" ]; then python nhl_v2_forward_integrity_grade.py grade; fi
      - name: Append-only commit
        env:
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name "nhl-v2-forward"; git config user.email "noreply@example.invalid"
          git add nhl_models/nhl_player_outcome_v2/phase1a_sog_forward
          git diff --cached --quiet || (git commit -m "NHL V2 SOG forward: append ledger rows ($MODE)" && git push origin "HEAD:$GITHUB_REF_NAME")
