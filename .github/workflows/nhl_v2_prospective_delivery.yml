name: NHL V2 authentic pregame count research collector

# Independent of old NHL fixed-2.5 classifiers and of NFL/CFB pipelines.
# The original Phase1A B2 model remains frozen on a research-only branch.
# Run at offsets that enter :00 and :30 game cutoff windows; late runs
# record missed cutoffs instead of constructing hindsight forecasts.
on:
  push:
    branches:
      - feat/nhl-v2-automated-prospective-count-20261011
      - fix/nhl-v2-persist-verified-cutoffs-20261011
      - main
    paths:
      - .github/workflows/nhl_v2_prospective_delivery.yml
      - tests/test_nhl_v2_collector_release.py
      - nhl_v2_secondary_cutoff_gate.py
      - tests/test_nhl_v2_secondary_cutoff_gate.py
      - nhl_v2_cutoff_window_worker.py
      - tests/test_nhl_v2_cutoff_window_worker.py
  pull_request:
    paths:
      - .github/workflows/nhl_v2_prospective_delivery.yml
      - tests/test_nhl_v2_collector_release.py
      - nhl_v2_secondary_cutoff_gate.py
      - tests/test_nhl_v2_secondary_cutoff_gate.py
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - NHL forward watchdog (redundant trigger for the same collector)
      - NHL forward snapshot (durable evidence capture)
      - All Sports Predictions
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: nhl-v2-original-lock-research-collector
  cancel-in-progress: false

jobs:
  secondary-cutoff-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule')
    outputs:
      should_run: ${{ steps.eligible.outputs.should_run }}
      launch_collector: ${{ steps.eligible.outputs.launch_collector }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Only awaken expensive frozen V2 model during actual NHL cutoff
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "launch_collector=false" >> "$GITHUB_OUTPUT"
            echo "PR verifies original NHL B2 engine without delivering forecasts"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            python nhl_v2_secondary_cutoff_gate.py --github-output /tmp/nhl-b2-gate.env
            sed 's/^should_run=/launch_collector=/' /tmp/nhl-b2-gate.env >> "$GITHUB_OUTPUT"
          else
            python nhl_v2_secondary_cutoff_gate.py --github-output /tmp/nhl-b2-gate.env
            cat /tmp/nhl-b2-gate.env >> "$GITHUB_OUTPUT"
            sed 's/^should_run=/launch_collector=/' /tmp/nhl-b2-gate.env >> "$GITHUB_OUTPUT"
          fi
      - name: Prove watchdog backup gate never invents forecast cutoffs
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_nhl_v2_secondary_cutoff_gate.py tests/test_nhl_v2_cutoff_window_worker.py
  check-original-research-model:
    needs: secondary-cutoff-preflight
    if: needs['secondary-cutoff-preflight'].outputs.should_run == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
      - uses: actions/checkout@v4
        with:
          repository: deshawnclark116-prog/mlb-picks2
          # Original research model and entire hash-chained data history.
          # verify_lock() REFUSES modifications to any frozen model/code file.
          ref: feature/nhl-v2-nfl-style-projection-board
          path: original
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce NHL separate-checkout commit regression and research-only safety
        run: python -m unittest discover -s website/tests -p test_nhl_v2_collector_release.py -v
      - name: Install pinned research runtime
        run: python -m pip install -r original/requirements-research-nhl.txt
      - name: Validate source-lock, original receipt hashes and correct NB2 distribution derivation
        run: |
          set -euo pipefail
          cd original
          python nhl_v2_phase1a_sog_forward.py verify
          python nhl_v2_projection_board_publish.py --out /tmp/nhl_verified_research_preview.json
          cd ..
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nhl_verified_research_preview.json')
          board=json.loads(p.read_text())
          assert board['verified_original_hash_chain'] is True
          assert board['verified_frozen_code_and_model_lock'] is True
          assert board['not_a_betting_board'] is True
          assert board['actual_player_book_lines_verified'] is False
          assert board['dressed_lineups_verified'] is False
          assert board['historical_corrected_probabilities_were_not_published_pregame'] is True
          assert board['total_valid_forecasts']>0
          assert 'line' not in board['row_fields'] and 'pick' not in board['row_fields']
          print('Original locked model source',board['source_ledger_sha256'])
          print('Historical real model forecasts',board['total_valid_forecasts'])
          print('Historical pregame dates',board['dates'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nhl-original-v2-verified-readonly-projection-preview
          path: /tmp/nhl_verified_research_preview.json
          retention-days: 30

  prospective-collector:
    needs: [secondary-cutoff-preflight, check-original-research-model]
    if: always() && github.ref == 'refs/heads/main' && needs['secondary-cutoff-preflight'].result == 'success' && needs['secondary-cutoff-preflight'].outputs.launch_collector == 'true' && (needs['check-original-research-model'].result == 'success' || needs['check-original-research-model'].result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 132
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: deshawnclark116-prog/mlb-picks2
          ref: feature/nhl-v2-nfl-style-projection-board
          path: original
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r original/requirements-research-nhl.txt
      - name: Continuously cover NEXT 108 minutes of real NHL pregame cutoffs using original frozen B2
        run: |
          set -euo pipefail
          # The model and website are checked out under separate directories.
          # The worker script is tracked in the website checkout, NOT runner root.
          python -u website/nhl_v2_cutoff_window_worker.py \
            --model-dir original \
            --website-dir website \
            --duration-min 108 \
            --report /tmp/nhl_v2_resident_receipt.json

      - name: Preserve exact worker attempt evidence even when a real cutoff fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-v2-resident-first-pregame-attempt-${{ github.run_id }}
          path: /tmp/nhl_v2_resident_receipt.json
          if-no-files-found: warn
          retention-days: 60
