name: CFB original 170 player-stat research feed (read-only publisher)
on:
  push:
    branches: [main, feature/cfb-real-stat-projection-publisher]
    paths:
      - "cfb_original_pregame_projection_publisher.py"
      - "tests/test_cfb_original_pregame_projection_publisher.py"
      - ".github/workflows/cfb_original_projection_publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cfb-original-playerstat-research-publisher
  cancel-in-progress: false

jobs:
  research-view:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test research contract and source integrity
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_cfb_original_pregame_projection_publisher.py
          python -m py_compile cfb_original_pregame_projection_publisher.py
      - name: Retrieve ACTUAL original Oct 10 pregame artifact and GitHub proof
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfb_original" research_out
          gh run download 38053736857 --repo "$GITHUB_REPOSITORY" \
            --name cfb-2026-event-source-research-only \
            --dir "$RUNNER_TEMP/cfb_original"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38053736857" \
            > "$RUNNER_TEMP/cfb_original/github_original_run.json"
          find "$RUNNER_TEMP/cfb_original" -maxdepth 3 -type f -printf '%P\n' | sort
          test "$(find "$RUNNER_TEMP/cfb_original" -name cfb_2026_week6_boxscore_baseline.json -type f | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/cfb_original" -name cfb_2026_shadow_forecasts.json -type f | wc -l)" -eq 1
      - name: Build only presentation contract, never edit model forecasts
        run: |
          set -euo pipefail
          BASE="$(find "$RUNNER_TEMP/cfb_original" -name cfb_2026_week6_boxscore_baseline.json -type f)"
          SIM="$(find "$RUNNER_TEMP/cfb_original" -name cfb_2026_shadow_forecasts.json -type f)"
          sha256sum "$BASE" "$SIM"
          python -u cfb_original_pregame_projection_publisher.py \
            --original-baseline "$BASE" \
            --original-shadow "$SIM" \
            --original-run-metadata "$RUNNER_TEMP/cfb_original/github_original_run.json" \
            --out research_out/cfb_real_stat_research.json
          git diff --exit-code -- docs/cfb_predictions.json docs/cfb_picks_log.jsonl docs/cfb_record.json cfb_models
      - name: Archive validated feed, source hashes and original run proof
        uses: actions/upload-artifact@v4
        with:
          name: cfb-170-playerstat-projections-for-mobile
          path: research_out/cfb_real_stat_research.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish only read-only research JSON to GitHub Pages path
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp research_out/cfb_real_stat_research.json docs/cfb_real_stat_research.json
          git config user.name "cfb-playerstat-publisher"
          git config user.email "cfb-playerstat-publisher@users.noreply.github.com"
          git add docs/cfb_real_stat_research.json
          if git diff --cached --quiet; then echo "No research view changed"; exit 0; fi
          git commit -m "CFB read-only: display original frozen 170 player-stat baselines and 15 MC"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Cannot publish research view"; exit 1
