name: NHL new engine page verified count forecasts
on:
  push:
    branches: [feat/nhl-v2-shots-page-current-main-20261011]
  pull_request:
    paths:
      - docs/nhl.html
      - docs/nhl_v2_shadow.json
      - docs/index.html
      - docs/nfl.html
      - tests/test_nhl_projection_site.py
      - .github/workflows/nhl_v2_page_integrity.yml
permissions:
  contents: read
jobs:
  projection-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Real original frozen model artifact and page contract
        run: |
          python -m pytest -q tests/test_nhl_projection_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/nhl_v2_shadow.json').read_text())
          assert d['verified_original_hash_chain'] is True
          assert d['verified_frozen_code_and_model_lock'] is True
          assert d['not_a_betting_board'] is True
          assert d['actual_player_book_lines_verified'] is False
          assert d['dressed_lineups_verified'] is False
          assert d['historical_corrected_probabilities_were_not_published_pregame'] is True
          assert d['total_valid_forecasts'] > 0
          assert sum(map(len,d['forecasts'].values())) == d['total_valid_forecasts']
          assert 'line' not in d['row_fields'] and 'pick' not in d['row_fields']
          print('REAL V2 ORIGINAL-HASH VERIFIED HISTORICAL SHOT COUNTS',d['total_valid_forecasts'])
          print('ORIGINAL FORWARD DATES',d['dates'])
          PY
      - name: Ensure JS parses and no live model output changed
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          raw=Path('docs/nhl.html').read_text()
          js=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',raw,re.S)
          assert len(js)==1
          Path('/tmp/nhl-v2-page.js').write_text(js[0])
          PY
          node --check /tmp/nhl-v2-page.js
          git diff --exit-code -- docs/nhl_predictions.json docs/nfl_predictions.json docs/nhl_picks_log.jsonl nhl_models
