name: NFL V2 independent Sunday analyst QA and admission (no betting)

on:
  push:
    branches: [main]
    paths:
      - nfl_v2_sunday_pregame_admission.py
      - tests/test_nfl_v2_sunday_pregame_admission.py
      - .github/workflows/nfl_v2_sunday_pregame_admission.yml
      - docs/nfl_v2_sunday_pregame_readiness.html
  pull_request:
    paths:
      - nfl_v2_sunday_pregame_admission.py
      - tests/test_nfl_v2_sunday_pregame_admission.py
      - .github/workflows/nfl_v2_sunday_pregame_admission.yml
      - docs/nfl_v2_sunday_pregame_readiness.html
  # Run ahead of early/1PM/4PM games and after 90-min model receipts.
  # This reads already-published artifacts, no repeated sportsbook API calls.
  schedule:
    - cron: "11 10,12,14,16,18,20,22 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nfl-v2-sunday-risk-audit
  cancel-in-progress: false

jobs:
  test-sunday-analyst-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Verify no false starter, odds or model confidence claims
        run: |
          python -m pytest tests/test_nfl_v2_sunday_pregame_admission.py -q
          python -m py_compile nfl_v2_sunday_pregame_admission.py

  publish-real-sunday-role-risk:
    if: github.ref == 'refs/heads/main'
    needs: test-sunday-analyst-gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect current original pregame shadow versus independent roster evidence
        run: |
          python -u nfl_v2_sunday_pregame_admission.py \
            --shadow docs/nfl_phase1_shadow.json \
            --role docs/nfl_role_snapshot.json \
            --out "$RUNNER_TEMP/nfl-v2-sunday-qa.json"
          python - "$RUNNER_TEMP/nfl-v2-sunday-qa.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schema']=='NFL_V2_SUNDAY_PREGAME_ROLE_AND_QB_READINESS_V1'
          assert d['source_model_mutated'] is False
          assert d['official_bets_emitted']==0 and not d['official_bet_candidates']
          assert d['archived_lines_verified_still_offered'] is False
          assert d['summary']['future_games_with_pregame_model']<=d['summary']['future_games']
          print('NFL_SUNDAY_TRUE_READINESS',json.dumps(d['summary'],sort_keys=True))
          PY
      - name: Publish visibility report only; leave all frozen forecasts unchanged
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/nfl-v2-sunday-qa.json" docs/nfl_v2_sunday_pregame_readiness.json
            git add docs/nfl_v2_sunday_pregame_readiness.json
            if git diff --cached --quiet; then break; fi
            git commit -m "Record pregame V2 QB/role readiness and blocked bets"
            if git push origin HEAD:main; then
              echo "NFL_V2_ANALYST_QA_PUBLISHED"
              break
            fi
            if [ "$n" = 5 ]; then
              echo "::error::Could not publish V2 analyst QA"; exit 1
            fi
            sleep "$n"
          done
