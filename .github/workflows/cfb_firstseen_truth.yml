name: CFB immutable-first-pregame reality audit
on:
  push:
    branches: [audit/cfb-saturday-pregame-truth-20261011]
    paths:
      - cfb_daily_firstseen_forensics.py
      - tests/test_cfb_daily_firstseen_forensics.py
      - .github/workflows/cfb_firstseen_truth.yml
      - .github/workflows/all_sports_predictions.yml
  pull_request:
    paths:
      - cfb_daily_firstseen_forensics.py
      - tests/test_cfb_daily_firstseen_forensics.py
      - .github/workflows/cfb_firstseen_truth.yml
      - .github/workflows/all_sports_predictions.yml
permissions:
  contents: read
jobs:
  read-only-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Prove first-seen dates, confidence accounting and Saturday truth
        run: python -m pytest -q tests/test_cfb_daily_firstseen_forensics.py
      - name: Generate real Saturday audit from immutable first-pregame forecasts
        run: |
          python cfb_daily_firstseen_forensics.py --date-et 2026-10-10 --out /tmp/cfb_saturday.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cfb_saturday.json'))
          print('CFB FIRST-SEEN 2026-10-10',json.dumps({
            'graded':x['all'],
            'moneyline':x['moneyline'],
            'market_sides':x['model_threshold_side_counts'],
            'ungraded_all_dates':x['global_ungraded_NOT_date_scoped']
          },sort_keys=True))
          assert x['decision']=='OBSERVATIONAL_ONLY_NO_POST_HOLDOUT_TUNING'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-saturday-original-forecast-forensics
          path: /tmp/cfb_saturday.json
          retention-days: 90
