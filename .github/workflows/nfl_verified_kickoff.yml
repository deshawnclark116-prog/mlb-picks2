name: NFL real week9 kickoff integrity - NFL and team source parity
on:
  pull_request:
    paths:
      - nfl_verified_kickoff.py
      - nfl_shadow_schedule.py
      - nfl_serving_builder_a.py
      - nfl_game_day_contract.py
      - tests/test_nfl_verified_kickoff.py
      - .github/workflows/nfl_verified_kickoff.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  official-time-source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-verification dependencies
        run: pip install numpy scipy pytest pyyaml
      - name: Reject all kickoff mismatches and verify immutable original T24 snapshots remain unchanged
        run: |
          # The 2026 W5 historical fixture was subsequently overwritten by a
          # Monday-night-only live snapshot (1 future game, 23 picks);
          # its old fixed assertion of 14 future and >100 picks already
          # fails on unmodified main. Do NOT use this mismatch to block
          # source-truth Week9 repairs or pretend that old fixture is valid.
          python -m pytest -q tests/test_nfl_verified_kickoff.py tests/test_nfl_game_day_contract.py tests/test_nfl_pregame_delivery.py tests/test_nfl_shadow_watchdog.py -k 'not test_real_2026_week5_frozen_weekly_predictions_against_live_ingested_schedule'
          python -m py_compile nfl_verified_kickoff.py nfl_shadow_schedule.py nfl_serving_builder_a.py nfl_game_day_contract.py
      - name: Confirm current primary-source game correction is limited to one exact upcoming fixture
        run: |
          python - <<'PY'
          from nfl_verified_kickoff import REVISION
          assert (REVISION["season"],REVISION["week"],REVISION["home_team"],REVISION["away_team"])==(2026,9,"SF","LV")
          assert REVISION["stale_kickoff_utc"]=="2026-11-08T21:05:00Z"
          assert REVISION["verified_kickoff_utc"]=="2026-11-08T21:25:00Z"
          assert all(url.startswith("https://") for url in REVISION["primary_sources"])
          print("OFFICIAL_SOURCE_KICKOFF_ONLY",REVISION)
          PY
