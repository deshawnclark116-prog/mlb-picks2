name: NFL V2 Phase1O-R role change / usage inflection engine (research only)

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_v2_archival_status.py"
      - "nfl_v2_phase1o_*.py"
      - "tests/test_nfl_v2_phase1o_*.py"
      - "nfl_models/nfl_player_outcome_v2/phase1o_*"
      - "nfl_models/nfl_player_outcome_v2/research_registry.json"
      - ".github/workflows/nfl_v2_phase1o_role_change.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy==2.3.5 pytest
      - name: Archival integrity gates for Phase1H / 1I / 1K (stdlib only, no model code)
        run: |
          python -u nfl_v2_archival_status.py --phase h --data-dir /tmp/archival-h --runtime-out /tmp/phase1h-archival-runtime.json
          python -u nfl_v2_archival_status.py --phase i --data-dir /tmp/archival-i --runtime-out /tmp/phase1i-archival-runtime.json
          python -u nfl_v2_archival_status.py --phase k --data-dir /tmp/archival-k --runtime-out /tmp/phase1k-archival-runtime.json
      - name: Deterministic tests and protected-history checks
        run: |
          python -m pytest -q tests/test_nfl_v2_*.py
      - name: Reproduce the pinned role source audit (2023-2024 only)
        run: |
          for i in 1 2 3 4; do   # transient GitHub release download failures are retried; a digest mismatch still fails immediately
            python -u nfl_v2_phase1o_role_sources.py --fetch --data-dir /tmp/p1o-data --out /tmp/p1o-audit.json && break
            [ "$i" = 4 ] && exit 1
            sleep $((i*20))
          done
          cmp nfl_models/nfl_player_outcome_v2/phase1o_role_source_audit.json /tmp/p1o-audit.json
      - name: 2024 development, competent-human baseline, lock and receipts
        run: |
          mkdir -p /tmp/p1o-out
          cp nfl_models/nfl_player_outcome_v2/phase1o_role_source_audit.json /tmp/p1o-out/
          python -u nfl_v2_phase1o_role_change.py --stage develop --data-dir /tmp/p1o-data --out-dir /tmp/p1o-out
          cmp nfl_models/nfl_player_outcome_v2/phase1o_development_lock.json /tmp/p1o-out/phase1o_development_lock.json
          cmp nfl_models/nfl_player_outcome_v2/phase1o_competent_human_role.json /tmp/p1o-out/phase1o_competent_human_role.json
          cmp nfl_models/nfl_player_outcome_v2/phase1o_role_receipts.jsonl.gz /tmp/p1o-out/phase1o_role_receipts.jsonl.gz
      - name: Untouched 2025 validation (opened ONLY if the development lock passed)
        run: |
          if python -c "import json,sys;sys.exit(0 if json.load(open('/tmp/p1o-out/phase1o_development_lock.json'))['development_gate_passed'] else 1)"; then
            python -u nfl_v2_phase1o_role_sources.py --fetch --years 2023,2024,2025 --data-dir /tmp/p1o-data
            python -u nfl_v2_phase1o_role_change.py --stage validate --data-dir /tmp/p1o-data --out-dir /tmp/p1o-out
          else
            echo "Development gate failed: 2025 is not opened."
          fi
      - name: 2026 W1-4 (exact pinned bytes unavailable; opens nothing) and close-out
        run: |
          python -u nfl_v2_phase1o_role_change.py --stage burned2026 --out-dir /tmp/p1o-out
          cmp nfl_models/nfl_player_outcome_v2/phase1o_role_results.json /tmp/p1o-out/phase1o_role_results.json
      - name: Compact result on existing PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const r=JSON.parse(fs.readFileSync('/tmp/p1o-out/phase1o_role_results.json','utf8'));
            const f=x=>x==null?'NA':x.toFixed(3);
            let body='<!-- nfl-phase1o-role -->\n## Phase1O-R role change / usage inflection engine\n';
            body+=`Head: \`${context.payload.pull_request.head.sha}\`\n\n**${r.verdicts.overall}**. Per head: ${Object.entries(r.verdicts.per_head).map(([h,v])=>h+' '+v).join('; ')}.\n\n`;
            body+='| Head | Phase1D oracle MAE (2024 W9-18) | Human | Best family | Candidate MAE | Survives |\n|---|---:|---:|---|---:|---|\n';
            for(const [h,v] of Object.entries(r.development_2024)){const b=v.families[v.best_candidate]||{};body+=`| ${h} | ${f(v.comparators.C1.oracle_mae)} | ${f(v.comparators.C3.oracle_mae)} | ${v.best_candidate} | ${f(b.oracle_mae)} | ${v.development_pass} |\n`;}
            body+=`\n2025: ${JSON.stringify(r.validation_2025.status||'validated')}. 2026 W1-4: ${r.burned_2026_w1_4.status}. Downstream Phase1E: ${r.downstream_phase1e.status}.\n\nFamily B (snap change): BLOCKED_DATA (id mapping below the preregistered 95%).\n\nArchival gates H/I/K ran first. No replacement data. No sportsbook, Monte Carlo, Week 5+, production or frozen-research changes.\n`;
            const params={...context.repo,issue_number:context.issue.number};
            const comments=await github.paginate(github.rest.issues.listComments,params);
            const old=comments.find(c=>c.user.type==='Bot'&&c.body?.includes('<!-- nfl-phase1o-role -->'));
            if(old)await github.rest.issues.updateComment({...context.repo,comment_id:old.id,body});
            else await github.rest.issues.createComment({...params,body});
      - name: Upload audit, results, baseline, lock, receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v2-phase1o-role-change
          path: |
            /tmp/p1o-audit.json
            /tmp/p1o-out/
            /tmp/phase1h-archival-runtime.json
            /tmp/phase1i-archival-runtime.json
            /tmp/phase1k-archival-runtime.json
          if-no-files-found: warn
