name: NHL V2 FanDuel MAIN SOG source evidence (research only)

# The repo already uses secrets.ODDS_API_KEY for NFL diagnostic.
# Live NHL calls are tightly capped; never alternate markets or other books.
on:
  push:
    branches: [main]
    paths:
      - nhl_v2_live_fanduel_sog_probe.py
      - nhl_sog_fanduel_mainline_reference.py
      - .github/workflows/nhl_v2_fanduel_live_source.yml
  pull_request:
    paths:
      - nhl_v2_live_fanduel_sog_probe.py
      - nhl_sog_fanduel_mainline_reference.py
      - tests/test_nhl_v2_live_fanduel_sog_probe.py
      - tests/test_nhl_sog_fanduel_mainline_reference.py
      - .github/workflows/nhl_v2_fanduel_live_source.yml
  schedule:
    - cron: "37 18,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nhl-v2-real-bookline-source
  cancel-in-progress: false

jobs:
  prove-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test actual API response shape, multi-horizon identity and quota cap
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_nhl_v2_live_fanduel_sog_probe.py tests/test_nhl_sog_fanduel_mainline_reference.py
          python -m py_compile nhl_v2_live_fanduel_sog_probe.py nhl_sog_fanduel_mainline_reference.py
          git diff --exit-code -- docs/nhl_predictions.json docs/nhl_picks_log.jsonl docs/nhl_v2_shadow.json nhl_models

  query-only-authentic-fanduel-source:
    if: github.ref == 'refs/heads/main'
    needs: prove-source-admission
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check only pregame model games, at most 3 paid event markets
        run: |
          set +e
          python -u nhl_v2_live_fanduel_sog_probe.py \
            --board docs/nhl_v2_shadow.json \
            --private-out /tmp/nhl_v2_real_fanduel_internal.json \
            --public-out /tmp/nhl_v2_fanduel_public_status.json \
            --max-events 3
          echo "SOURCE_CHECK_EXIT=$?" >> "$GITHUB_ENV"
          set -e
      - name: Publish ONLY bookmaker-source status; never individual odds prices
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nhl_v2_fanduel_public_status.json')
          assert p.is_file(), 'Missing source observation must be a red deployment'
          d=json.loads(p.read_text())
          assert d['schema']=='NHL_V2_REAL_FANDUEL_SOG_BOUNDED_PROVIDER_CHECK_V1'
          assert d['actual_paid_event_calls']<=3
          assert d['official_picks']==0 and d['lineup_certified'] is False
          assert 'records' not in d and 'retrieval_hashes' not in d
          assert 'apiKey' not in p.read_text()
          print('AUTHENTIC_NHL_FANDUEL_MARKET_SOURCE_STATUS',d['status'],
                'paid calls',d['actual_paid_event_calls'],
                'matched player lines',d['qualified_player_main_lines'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p docs
            cp /tmp/nhl_v2_fanduel_public_status.json docs/nhl_v2_fanduel_source_status.json
            git add docs/nhl_v2_fanduel_source_status.json
            if git diff --cached --quiet; then
              echo "UNCHANGED_NHL_LIVE_BOOKLINE_STATUS"
              break
            fi
            git commit -m "NHL V2 actual FanDuel bookmaker line source diagnostic"
            if git push origin HEAD:main; then
              echo "NHL_LIVE_BOOKLINE_COVERAGE_STATUS_PUBLISHED"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Could not publish provider status"
              exit 1
            fi
            sleep "$attempt"
          done
          if [ "${SOURCE_CHECK_EXIT}" != "0" ]; then
            echo "::error::The genuine NHL FanDuel source check was not usable"
            exit 1
          fi
          # Per-player odds and the key stay in ephemeral runner files, not
          # uploaded to an artifact or publicly committed without source rights.
